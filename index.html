        function handleGesture(handLandmarks) {
            // Allow processing in INTERPRETING and IDLE state too
            if (currentState !== STATE.PICKING && currentState !== STATE.INTERPRETING && currentState !== STATE.IDLE) return;
            
            const palm = handLandmarks[9]; 
            const x = palm.x; 
            const y = palm.y;

            // Initialize lastHandX if needed
            if (lastHandX === -1) {
                lastHandX = x;
                lastHandY = y;
                return;
            }

            // Update Cursor Visuals
            const cursor = document.getElementById('hand-cursor');
            const screenX = (1 - x) * window.innerWidth; // Mirror X
            const screenY = y * window.innerHeight;
            
            cursor.style.display = 'block';
            cursor.style.left = screenX + 'px';
            cursor.style.top = screenY + 'px';

            // Always spawn trail for "cool" factor when moving
            const distMoved = Math.sqrt(Math.pow(x - lastHandX, 2) + Math.pow(y - lastHandY, 2));
            if (distMoved > 0.005) {
                spawnTrail(screenX, screenY);
            }

            // --- START & INTERPRETATION LOGIC ---
            if (currentState === STATE.IDLE || currentState === STATE.INTERPRETING) {
                const progressContainer = document.getElementById('charge-progress-container');
                const progressBar = document.getElementById('charge-progress-bar');
                
                if (isOpenPalm(handLandmarks)) {
                    if (!isPalmHeld) {
                        isPalmHeld = true;
                        palmHoldStart = Date.now();
                        // Show progress bar
                        progressContainer.style.display = 'block';
                        progressBar.style.width = '0%';
                    }
                    
                    const elapsed = Date.now() - palmHoldStart;
                    const progress = Math.min(elapsed / INTERPRET_HOLD_TIME, 1.0);
                    
                    // Visuals
                    if (Math.random() < 0.5) spawnInterpretationParticles();
                    
                    // Update Progress Bar
                    progressBar.style.width = (progress * 100) + '%';
                    
                    if (elapsed > INTERPRET_HOLD_TIME) {
                        // Trigger Action
                        if (currentState === STATE.IDLE) {
                            startGame();
                        } else if (currentState === STATE.INTERPRETING) {
                            openInterpretation();
                        }
                        
                        // Reset vars but keep state (modal will handle overlay)
                        isPalmHeld = false;
                        palmHoldStart = 0;
                        progressContainer.style.display = 'none';
                    }
                } else {
                    if (isPalmHeld) {
                        isPalmHeld = false;
                        palmHoldStart = 0;
                        
                        // Reset Visuals
                        progressContainer.style.display = 'none';
                        progressBar.style.width = '0%';

                        if (currentState === STATE.IDLE) {
                             updateIdleStatus();
                        } else {
                             document.getElementById('status-text').innerText = "Trải bài của bạn mang thông điệp gì?";
                        }
                    }
                }
                lastHandX = x;
                lastHandY = y;
                return; // Skip picking logic
            }

            // --- ZONE BASED LOGIC (Replaced Movement Logic) ---
            const width = window.innerWidth;
            let targetV = 0;
            const MAX_SCROLL_SPEED = 0.2; // Max speed at edge of screen
            
            if (screenX < width * 0.33) {
                // LEFT ZONE (0 - 1/3)
                // Speed increases as we get closer to the left edge (0)
                const distFromCenter = (width * 0.33) - screenX;
                const maxDist = width * 0.33;
                const intensity = Math.min(distFromCenter / maxDist, 1.0); // 0 to 1
                
                targetV = -intensity * MAX_SCROLL_SPEED;
                highlightDirection('left');
            } else if (screenX > width * 0.66) {
                // RIGHT ZONE (2/3 - 1)
                // Speed increases as we get closer to the right edge (width)
                const distFromCenter = screenX - (width * 0.66);
                const maxDist = width * 0.34;
                const intensity = Math.min(distFromCenter / maxDist, 1.0); // 0 to 1
                
                targetV = intensity * MAX_SCROLL_SPEED;
                highlightDirection('right');
            } else {
                // CENTER ZONE (1/3 - 2/3)
                // Stop Scrolling
                targetV = 0;
                
                // Only clear highlights if not selecting
                if (!isFistHeld) resetHighlights();
            }
            
            // Smoothly interpolate velocity towards target
            // This prevents jerky starts/stops
            velocity = velocity * 0.8 + targetV * 0.2;

            // --- SELECTION LOGIC (Middle 1/3 + 1s Hold) ---
            const inCenterZone = screenX > width * 0.33 && screenX < width * 0.66;
            const fistDetected = isFist(handLandmarks);

            if (fistDetected && inCenterZone) {
                // Cursor stays same shape/color
                
                if (!isFistHeld) {
                    // Start Holding
                    isFistHeld = true;
                    fistHoldStart = Date.now();
                    lockedSelectIndex = Math.round(currentIndex);
                    chargeTargetIndex = lockedSelectIndex;
                    chargeExtraScale = 1;
                    highlightDirection('select');
                }
                
                // Calculate Progress
                const elapsed = Date.now() - fistHoldStart;
                const progress = Math.min(elapsed / SELECTION_HOLD_TIME, 1.0);
                chargeExtraScale = 1 + progress * 0.15;
                
                // Glow Effect on Target Card
                const targetIdx = lockedSelectIndex ?? Math.round(currentIndex);
                const cards = document.querySelectorAll('.card-wrapper');
                cards.forEach(card => {
                    if (parseInt(card.dataset.index) === targetIdx) {
                        // White glow increasing with progress - Intensified
                        const glowSize = 30 + (progress * 100);
                        const glowAlpha = 0.8 + (progress * 0.2); // Starts bright, stays bright
                        // Multiple layers for intense glow
                        card.style.boxShadow = `
                            0 0 ${glowSize}px rgba(255, 255, 255, ${glowAlpha}),
                            0 0 ${glowSize * 0.5}px rgba(255, 255, 255, 1),
                            inset 0 0 30px rgba(255, 255, 255, 0.5)
                        `;
                        card.style.filter = `brightness(${1 + progress * 1.5})`; // Make it blindingly bright
                        card.style.zIndex = 2000; // Ensure on top
                        
                        // Spawn Particles
                        spawnChargeParticles(card.getBoundingClientRect());
                        
                    } else {
                         // Reset others if needed, though usually handled in updateCardPositions
                         // We should let updateCardPositions handle base state, but here we override.
                         card.style.filter = ''; // Reset filter
                         card.style.boxShadow = ''; // Reset shadow
                    }
                });

                updateChargeVisuals(true, screenX, screenY, progress);
                
                if (elapsed > SELECTION_HOLD_TIME) {
                    // Trigger Selection
                    selectCard();
                    
                    // Reset
                    isFistHeld = false;
                    fistHoldStart = 0;
                    lockedSelectIndex = null;
                    chargeTargetIndex = null;
                    chargeExtraScale = 1;
                    updateChargeVisuals(false);
                    
                    // Cleanup any remaining glow immediately on select (or keep it as feedback?)
                    // Actually selectCard hides the card, so we are fine.
                    
                    // Success Burst
                    const ring = document.createElement('div');
                    ring.style.position = 'absolute';
                    ring.style.left = screenX + 'px';
                    ring.style.top = screenY + 'px';
                    ring.style.width = '100px';
                    ring.style.height = '100px';
                    ring.style.border = '4px solid white';
                    ring.style.borderRadius = '50%';
                    ring.style.transform = 'translate(-50%, -50%)';
                    ring.style.animation = 'pulseRing 0.5s ease-out'; 
                    document.body.appendChild(ring);
                    setTimeout(() => ring.remove(), 500);
                }
                
            } else {
                // cursor.classList.remove('grabbing');
                if (isFistHeld) {
                    // Cancelled
                    isFistHeld = false;
                    fistHoldStart = 0;
                    lockedSelectIndex = null;
                    chargeTargetIndex = null;
                    chargeExtraScale = 1;
                    updateChargeVisuals(false);
                    resetHighlights();
                    
                    // Reset card styles immediately
                    const cards = document.querySelectorAll('.card-wrapper');
                    cards.forEach(card => {
                        card.style.filter = '';
                        card.style.boxShadow = '';
                    });
                }
            }
            
            lastHandX = x;
            lastHandY = y;
        }

        let targetIndex = 0; // Target for intro animation

        function gameLoop() {
            if (currentState === STATE.INTRO) {
                // Smoothly interpolate currentIndex to targetIndex
                const dist = targetIndex - currentIndex;
                // Exponential ease out
                currentIndex += dist * 0.05;
                
                // Check if close enough to stop intro
                if (Math.abs(dist) < 0.1) {
                    currentIndex = targetIndex;
                    currentState = STATE.PICKING;
                    document.getElementById('status-text').innerText = "Nắm tay lại để chọn lá bài bạn muốn";
                    document.getElementById('gesture-guide').style.opacity = '1';
                    // Show picked zone slots
                    document.getElementById('picked-zone').style.display = 'flex';
                }
                updateCardPositions();
            }
            
            if (currentState === STATE.PICKING) {
                if (isFistHeld && lockedSelectIndex !== null) {
                    currentIndex = lockedSelectIndex;
                    velocity = 0;
                } else {
                    // Apply Velocity
                    currentIndex += velocity;
                    
                    // Apply Friction
                    velocity *= FRICTION;
                    
                    // Stop if very slow
                    if (Math.abs(velocity) < 0.0001) velocity = 0;

                    // Bounds Checking with Bounce/Damping
                    if (currentIndex < 0) {
                        currentIndex = 0;
                        velocity = -velocity * 0.5; // Bounce
                    }
                    if (currentIndex > currentDeck.length - 1) {
                        currentIndex = currentDeck.length - 1;
                        velocity = -velocity * 0.5; // Bounce
                    }
                }
                
                updateCardPositions();
            }
            requestAnimationFrame(gameLoop);
        }

        function highlightDirection(dir) {
            resetHighlights();
            if (dir === 'left') document.getElementById('zone-right').classList.add('active'); // Visual Right is Swipe Left source?
            // Actually let's just highlight the side corresponding to movement
            // Hand moves Left -> Highlight Left Zone
            if (dir === 'left') document.getElementById('zone-left').classList.add('active'); // Wait, Left Zone is visually on Left
            if (dir === 'right') document.getElementById('zone-right').classList.add('active');
            if (dir === 'select') {
                document.getElementById('zone-center').classList.add('active');
                document.getElementById('icon-select').classList.add('active');
            }
        }
        
        function resetHighlights() {
            document.getElementById('zone-left').classList.remove('active');
            document.getElementById('zone-right').classList.remove('active');
            document.getElementById('zone-center').classList.remove('active');
            document.getElementById('icon-select').classList.remove('active');
        }

        // Start Loop
        requestAnimationFrame(gameLoop);

        function navigateDeck(dir) {
            // Keyboard support updates velocity for consistency
            velocity += dir * 0.1;
            if (dir < 0) highlightDirection('left');
            if (dir > 0) highlightDirection('right');
            setTimeout(resetHighlights, 200);
        }

        function selectCard() {
            if (currentState !== STATE.PICKING) return;
            
            // Select the card currently at the integer center
            const selectedIdxInt = Math.round(currentIndex);
            
            // Check if valid
            if (selectedIdxInt < 0 || selectedIdxInt >= currentDeck.length) return;
            
            // Check if already picked (though we remove them from flow usually)
            // But with splicing logic, we need to be careful.
            // New logic: We DON'T splice. We just mark them.
            
            const selectedCard = currentDeck[selectedIdxInt];
            
            // Check if this specific card ID is already picked
            if (pickedCards.some(p => p.card.id === selectedCard.id)) return;
            
            // Mark visually in the deck
            const cardElements = document.querySelectorAll('.card-wrapper');
            let sourceRect = null;
            
            cardElements.forEach(el => {
                if (parseInt(el.dataset.index) === selectedIdxInt) {
                    el.classList.add('picked');
                    el.style.opacity = '0'; // Hide from deck
                    sourceRect = el.getBoundingClientRect();
                }
            });

            // Add to picked list
            const isReversed = Math.random() < 0.3;
            pickedCards.push({
                card: selectedCard,
                reversed: isReversed,
                position: `Lá bài ${pickedCards.length + 1}`
            });

            // Update Status
            document.getElementById('status-text').innerText = `Đã chọn ${pickedCards.length}/3 lá bài`;

            // Animate to Slot
            const slotIndex = pickedCards.length - 1;
            const slot = document.getElementById(`slot-${slotIndex}`);
            if (slot) {
                slot.classList.add('filled');
                const miniCard = document.createElement('div');
                miniCard.className = 'mini-card';
                miniCard.style.backgroundImage = `url('https://www.transparenttextures.com/patterns/black-scales.png')`; // Back of card
                // Add star effect or something
                miniCard.innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;color:rgba(255,255,255,0.55);">✦</div>`;
                slot.appendChild(miniCard);
            }

            if (pickedCards.length === 3) {
                setTimeout(finishPicking, 1000);
            }
        }

        function finishPicking() {
            currentState = STATE.REVEALING;
            document.getElementById('status-text').innerText = "Hãy đón nhận thông điệp một cách tích cực";
            document.getElementById('gesture-guide').style.opacity = '0';
            
            // Hide picked zone (we will move them to center scene)
            document.getElementById('picked-zone').style.opacity = '0';
            
            renderDeck(); // Will switch to reveal layout
            
            setTimeout(() => {
                // All cards revealed after animation
                currentState = STATE.INTERPRETING;
                document.getElementById('status-text').innerText = "Trải bài của bạn mang thông điệp gì?";

                // Show the "Giải nghĩa" button now that all 3 cards are picked
                const btn = document.getElementById('interpret-btn');
                if (btn) {
                    btn.style.display = 'inline-block';
                    btn.onclick = openInterpretation;
                }
            }, 2500);
        }

        // --- 6. Interpretation (fully local, using CARD_DATA) ---
        // Vai trò của từng vị trí trong trải bài 3 lá (khung Nền tảng / Hiện tại / Xu hướng)
        const ROLE_LABELS = ['Nền tảng - điều bạn mang theo', 'Hiện tại - điều đang diễn ra', 'Xu hướng - điều đang định hình phía trước'];

        const ROLE_OPENERS = [
            ['Bắt đầu từ gốc rễ,', 'Lật lại điểm khởi đầu,', 'Soi vào nền tảng của câu chuyện,'],
            ['Bước sang hiện tại,', 'Ngay lúc này,', 'Ở thời điểm hiện tại,'],
            ['Và tất cả đang dẫn tới,', 'Nhìn về phía trước,', 'Xu hướng đang định hình là,']
        ];

        const INTRO_TEMPLATES = [
            (n) => `Khi ${n[0]}, ${n[1]} và ${n[2]} cùng xuất hiện trong một lần trải bài, ba lá không đứng tách rời mà đang nối lại thành một mạch chuyện duy nhất về hành trình bạn đang đi qua.`,
            (n) => `Ba lá bài ${n[0]}, ${n[1]} và ${n[2]} vừa xuất hiện không phải ngẫu nhiên — chúng đang cùng nhau phác hoạ một bức tranh có chiều sâu hơn nhiều so với việc đọc từng lá riêng lẻ.`,
            (n) => `Sự kết hợp giữa ${n[0]}, ${n[1]} và ${n[2]} tạo nên một trải bài mang tính liên kết chặt chẽ, nơi mỗi lá là một mắt xích trong cùng một câu chuyện đang diễn ra với bạn.`
        ];

        function analyzePattern(picked, d) {
            const majors = d.filter(x => x.arcana === 'major').length;
            const elements = d.map(x => x.element).filter(Boolean);
            const sameElement = elements.length === 3 && elements[0] === elements[1] && elements[1] === elements[2];
            const suits = d.map(x => x.suitVi).filter(Boolean);
            const sameSuit = suits.length === 3 && suits[0] === suits[1] && suits[1] === suits[2];
            const numbers = d.map(x => x.number);
            const sameNumber = numbers.length === 3 && numbers[0] === numbers[1] && numbers[1] === numbers[2] && numbers[0] !== undefined;
            const reversedCount = picked.filter(p => p.reversed).length;

            if (majors === 3) {
                return 'Cả ba lá đều thuộc bộ Ẩn Chính (Major Arcana) — đây là dấu hiệu cho thấy bạn đang ở trong một giai đoạn mang tính bước ngoặt thật sự, một chương lớn của cuộc đời chứ không đơn thuần là chuyện vụn vặt hằng ngày. Những gì đang xảy ra với bạn lúc này xứng đáng được nhìn nhận một cách nghiêm túc.';
            }
            if (sameSuit) {
                return `Cả ba lá đều thuộc nhóm ${suits[0]}, cho thấy chủ đề mà nhóm chất bài này đại diện đang chi phối rõ rệt giai đoạn hiện tại của bạn — mọi ngả rẽ trong trải bài này đều xoay quanh cùng một mối bận tâm.`;
            }
            if (sameElement) {
                return `Ba lá cùng mang nguyên tố ${elements[0]}, nghĩa là năng lượng xuyên suốt trải bài này khá thuần nhất — bạn đang được mời gọi hành xử nhất quán theo một kiểu năng lượng duy nhất trong suốt chặng đường này.`;
            }
            if (sameNumber) {
                return `Cả ba lá đều mang số ${numbers[0]}, một sự lặp lại không ngẫu nhiên — con số này đang nhấn mạnh một bài học hoặc một chu kỳ lặp đi lặp lại trong nhiều khía cạnh khác nhau của cuộc sống bạn.`;
            }
            if (reversedCount >= 2) {
                return 'Phần lớn các lá xuất hiện ở chiều ngược, gợi ý rằng đây là lúc bạn cần nhìn thẳng vào những gì đang bị chặn lại, trì hoãn hoặc chưa được giải quyết dứt điểm, thay vì chỉ đón nhận thông điệp một cách xuôi chiều.';
            }
            if (reversedCount === 0) {
                return 'Cả ba lá đều xuất hiện ở chiều xuôi, cho thấy năng lượng đang vận hành khá thông suốt — điều quan trọng lúc này là bạn có sẵn sàng hành động theo đúng những gì các lá bài đang chỉ ra hay không.';
            }
            return 'Trải bài có sự pha trộn giữa nhiều nhóm năng lượng khác nhau, phản ánh đúng thực tế rằng vấn đề bạn đang đối diện không đến từ một nguyên nhân duy nhất mà là sự cộng hưởng của nhiều yếu tố cùng lúc.';
        }

        function buildLinkedMessage() {
            const picked = pickedCards; // [{card, reversed, position}]
            const d = picked.map(p => CARD_DATA[p.card.name]);
            const n = picked.map(p => vnName(p.card.name));
            const seed = d.reduce((s, x, i) => s + (x.number || 0) + i, 0);

            const introFn = INTRO_TEMPLATES[seed % INTRO_TEMPLATES.length];
            let msg = introFn(n) + ' ' + analyzePattern(picked, d) + '\n\n';

            picked.forEach((p, i) => {
                const data = d[i];
                const opener = ROLE_OPENERS[i][seed % ROLE_OPENERS[i].length];
                const meaning = p.reversed ? data.rev : data.up;
                msg += `${opener} ${n[i]} (${p.reversed ? 'ngược' : 'xuôi'}) cho thấy: ${meaning}\n\n`;
            });

            const adv0 = picked[0].reversed ? d[0].revA : d[0].upA;
            const adv1 = picked[1].reversed ? d[1].revA : d[1].upA;
            const adv2 = picked[2].reversed ? d[2].revA : d[2].upA;
            msg += `Về những việc cụ thể nên làm: trước hết, ${lcFirst(adv0)} Kế đến, trong hiện tại, ${lcFirst(adv1)} Và để chuẩn bị cho chặng sắp tới, ${lcFirst(adv2)} Ba bước này không cần thực hiện hoàn hảo ngay lập tức — điều quan trọng là bạn bắt đầu từ bước phù hợp nhất với hoàn cảnh của mình lúc này, rồi để những bước còn lại tự nhiên nối tiếp theo thời gian.`;

            return msg;
        }

        function lcFirst(s) {
            if (!s) return s;
            return s.charAt(0).toLowerCase() + s.slice(1);
        }

        function renderLocalInterpretation() {
            const content = document.getElementById('interpretation-content');

            // Phần 1: Ý nghĩa chi tiết của từng lá bài
            let html = '<div id="cards-meaning">';
            pickedCards.forEach((p, i) => {
                const data = CARD_DATA[p.card.name];
                const name = vnName(p.card.name);
                const meaning = data ? (p.reversed ? data.rev : data.up) : '';
                html += `<h3>${ROLE_LABELS[i] || p.position}: ${name} ${p.reversed ? '(Ngược)' : '(Xuôi)'}</h3>`;
                html += `<p>${meaning}</p>`;
            });
            html += '</div>';

            // Phần 2: Thông điệp liên kết (~350-500 chữ, dựng theo từng bộ lá cụ thể)
            const linked = buildLinkedMessage().replace(/\n\n/g, '</p><p>');
            html += `<div id="linked-message">
                <h3>Thông điệp liên kết</h3>
                <p>${linked}</p>
            </div>`;

            content.innerHTML = html;
        }

        function openInterpretation() {
            // Show the full reading directly on the site — no external redirect
            renderLocalInterpretation();
            document.getElementById('interpretation-modal').style.display = 'block';
            document.getElementById('status-text').innerText = "Hãy đón nhận thông điệp một cách tích cực";
        }

        // --- 5. MediaPipe Setup ---
        async function setupCamera() {
            const videoElement = document.getElementById('webcam-preview');
            
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });
            
            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    handleGesture(results.multiHandLandmarks[0]);
                }
            });
            
            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 320,
                height: 240
            });
            
            return camera;
        }

        // --- 7. Initialization ---
        function startGame() {
            if (assetsFailed) {
                preloadDeckAssets();
                return;
            }
            if (!assetsReady) {
                updateIdleStatus();
                return;
            }
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('status-text').innerText = "Bánh xe định mệnh bắt đầu quay...";

            // Reveal the pick instruction ~0.7s after the destiny text appears
            setTimeout(() => {
                document.getElementById('status-text').innerText = "Nắm tay lại để chọn lá bài bạn muốn";
                document.getElementById('gesture-guide').style.opacity = '1';
                document.getElementById('picked-zone').style.display = 'flex';
            }, 700);
            
            // Start Game Flow
            currentDeck = shuffle([...FULL_DECK]); // Shuffle internal data
            pickedCards = [];
            
            // INTRO ANIMATION
            currentState = STATE.INTRO;
            targetIndex = Math.floor(currentDeck.length / 2); 
            currentIndex = currentDeck.length + 5; // Start way off
            
            renderDeck(); // Render cards
            updateCardPositions(); // Initial position update
        }

        async function initCameraFlow() {
             try {
                const camera = await setupCamera();
                await camera.start();
                
                // Camera success
                cameraReady = true;
                cameraError = false;
                document.getElementById('start-btn').style.display = 'none';
                updateIdleStatus();
             } catch (e) {
                console.error(e);
                cameraReady = false;
                cameraError = true;
                document.getElementById('status-text').innerText = "Cần quyền truy cập camera để điều khiển bằng cử chỉ";
                const btn = document.getElementById('start-btn');
                btn.style.display = 'block';
                btn.innerText = "Cho phép camera";
                btn.onclick = () => {
                    initCameraFlow(); // Retry
                };
             }
        }
        
        // Auto-start camera on load
        preloadDeckAssets();
        initCameraFlow();

        // Initialize Background
        initStars();
        
        // Keyboard fallback for testing
        window.addEventListener('keydown', (e) => {
            if (currentState !== STATE.PICKING) return;
            if (e.key === 'ArrowLeft') {
                navigateDeck(-1);
                highlightIcon('icon-left');
            }
            if (e.key === 'ArrowRight') {
                navigateDeck(1);
                highlightIcon('icon-right');
            }
            if (e.key === 'ArrowUp' || e.key === ' ') {
                selectCard();
                highlightIcon('icon-select');
            }
        });

    </script>
</body>
