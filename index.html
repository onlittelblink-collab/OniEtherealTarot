        @media (max-width: 768px) and (orientation: portrait) {
            :root {
                --card-width: clamp(92px, 24vw, 150px);
            }
        }

        @media (max-width: 480px) and (orientation: portrait) {
            :root {
                --card-width: clamp(86px, 26vw, 140px);
            }
        }

        @media (orientation: landscape) and (max-height: 520px) {
            :root {
                --card-width: clamp(96px, 26vh, 140px);
            }
        }

        /* Intro Animation Class - if needed, but we will use JS interpolation */
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Times New Roman', Times, serif;
            color: #eee;
            user-select: none;
        }

        /* Logo watermark — hình nền chìm của toàn trang */
        #logo-watermark {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: var(--logo-bg);
            background-repeat: no-repeat;
            background-position: center center;
            background-size: min(70vw, 70vh);
            opacity: 0.07;
            filter: grayscale(1) contrast(1.1);
            mix-blend-mode: screen;
            pointer-events: none;
        }

        /* Background Effects */
        #stars-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.8;
        }

        #fog-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, rgba(10,10,30, 0.9), transparent);
            z-index: 1;
            pointer-events: none;
        }

        #asset-loader {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(5, 5, 16, 0.92);
            backdrop-filter: blur(6px);
            pointer-events: auto;
        }

        #asset-progress-container {
            width: min(320px, 80vw);
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.08);
        }

        #asset-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.95));
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
            transition: width 0.15s linear;
        }

        /* Main Game Container */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 1200px; /* Increased perspective for deeper look */
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 3D Scene for Cards */
        #scene {
            width: 100%;
            height: 60vh;
            position: relative;
            transform-style: preserve-3d;
            /* removed transition, we handle it in JS loop */
            display: flex;
            justify-content: center;
            align-items: center;

        /* Card Styles */
        .card-wrapper {
            position: absolute;
            width: var(--card-width);
            height: var(--card-height);
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s;
            cursor: pointer;
            border-radius: 15px;
        }

        .card-wrapper.selected {
            box-shadow: 0 0 30px var(--accent-glow);
            z-index: 100;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            border-radius: 15px;
        }

        .card-wrapper.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);

            display: flex;
            align-items: center;
            justify-content: center;

        /* Elaborate back design using CSS pseudo-elements */
        .card-back::after {
            content: '✦';

        const ASSETS_PATH = 'assets/tarot/pkt/';

            // Major Arcana
            const majorNames = [
                "The Fool", "The Magician", "The High Priestess", "The Empress", "The Emperor", 
                "The Hierophant", "The Lovers", "The Chariot", "Strength", "The Hermit", 
                "Wheel of Fortune", "Justice", "The Hanged Man", "Death", "Temperance", 
                "The Devil", "The Tower", "The Star", "The Moon", "The Sun", 
                "Judgement", "The World"
            ];
            
            majorNames.forEach((name, i) => {
                const id = `ar${String(i).padStart(2, '0')}`;
                cards.push({ id, name, type: 'major', img: `${ASSETS_PATH}${id}.jpg` });
            });

            // Minor Arcana
            const suits = [
                { code: 'wa', name: 'Wands' },
                { code: 'cu', name: 'Cups' },
                { code: 'sw', name: 'Swords' },
                { code: 'pe', name: 'Pentacles' }
            ];
            
            const ranks = [
                { code: 'ac', name: 'Ace' },
                { code: '02', name: 'Two' }, { code: '03', name: 'Three' }, { code: '04', name: 'Four' },
                { code: '05', name: 'Five' }, { code: '06', name: 'Six' }, { code: '07', name: 'Seven' },
                { code: '08', name: 'Eight' }, { code: '09', name: 'Nine' }, { code: '10', name: 'Ten' },
                { code: 'pa', name: 'Page' }, { code: 'kn', name: 'Knight' }, { code: 'qu', name: 'Queen' }, { code: 'ki', name: 'King' }
            ];

            suits.forEach(suit => {
                ranks.forEach(rank => {
                    const id = `${suit.code}${rank.code}`;
                    cards.push({
                        id,
                        name: `${rank.name} of ${suit.name}`,
                        type: 'minor',
                        img: `${ASSETS_PATH}${id}.jpg`
                    });
                });
            });

            return cards;
        };

"up":"Một khởi đầu tràn đầy hứng khởi đang mở ra, mời gọi bạn bước đi với niềm tin dù chưa biết trước điều gì ở phía trước. Đây là lúc để dấn thân, thử điều mới và tin vào trực giác của mình. Trong chuyện tình cảm, lá bài gợi ý rằng một mối quan hệ mới mẻ, tự phát hoặc mong muốn được tự do trải nghiệm. Nhìn sang khía cạnh công việc, cơ hội khởi nghiệp, đổi hướng sự nghiệp hoặc thử thách chưa từng làm. Điều nên làm lúc này: Đừng để nỗi sợ ngăn bạn bước đi, nhưng hãy chuẩn bị tối thiểu trước khi nhảy.",
"rev":"Sự liều lĩnh hoặc thiếu chuẩn bị có thể khiến bạn gặp rắc rối. Cũng có thể bạn đang sợ hãi trước một bước ngoặt và cố tình trì hoãn quyết định. Năng lượng ngược lúc này gắn liền với các sắc thái như liều lĩnh, thiếu suy nghĩ, sợ hãi thay đổi, bốc đồng. Bài học rút ra từ lá bài này: Đừng để nỗi sợ ngăn bạn bước đi, nhưng hãy chuẩn bị tối thiểu trước khi nhảy.",
"upE":"một khởi đầu tinh khôi, lời mời bước vào cuộc phiêu lưu mà không cần biết trước điều gì sẽ xảy ra",
"revE":"một quyết định bồng bột hoặc nỗi sợ hãi khiến bạn giậm chân tại chỗ trước ngưỡng cửa mới",
"upA":"Hãy tin vào bản năng và mạnh dạn bước những bước đầu tiên.",
"revA":"Chậm lại một nhịp, nhìn rõ điều mình sợ trước khi hành động.","arcana":"major","element":"Khí","suitVi":"","number":0},
"The Magician":{
"up":"Bạn có đầy đủ công cụ, kỹ năng và nguồn lực để biến ý tưởng thành hiện thực. Đây là thời điểm để hành động với sự tự tin và tập trung ý chí vào mục tiêu. Nhìn về phía trái tim, sức hút mạnh mẽ, chủ động theo đuổi hoặc cần thành thật hơn trong giao tiếp. Ở môi trường làm việc, thời điểm tốt để khởi động dự án, thể hiện năng lực và chủ động dẫn dắt. Gợi ý thiết thực: Tập trung ý chí vào một mục tiêu rõ ràng thay vì dàn trải nguồn lực.",
"rev":"Tiềm năng đang bị lãng phí hoặc sử dụng sai mục đích. Có thể có sự lừa dối, thao túng hoặc bạn đang thiếu tập trung để hoàn thành việc gì đó. Ở chiều đảo ngược, những từ khóa nổi bật là thao túng, tiềm năng lãng phí, lừa dối, thiếu tập trung. Lời khuyên dành cho bạn: Tập trung ý chí vào một mục tiêu rõ ràng thay vì dàn trải nguồn lực.",
"upE":"khả năng biến ước mơ thành hiện thực khi bạn hội tụ đủ ý chí, kỹ năng và nguồn lực trong tay",
"revE":"sự thiếu tập trung hoặc những toan tính không thật khiến tiềm năng bị lãng phí",
"upA":"Tập trung ý chí vào một mục tiêu duy nhất và bắt tay hành động.",
"revA":"Kiểm tra lại động cơ thật sự của mình trước khi tiến thêm.","arcana":"major","element":"Khí","suitVi":"","number":1},
"The High Priestess":{
"up":"Câu trả lời bạn cần nằm ở trực giác và sự tĩnh lặng bên trong hơn là hành động bên ngoài. Hãy lắng nghe tiềm thức và những gì chưa được nói ra. Ở khía cạnh tình yêu, cảm xúc sâu kín chưa được bày tỏ, cần thời gian tìm hiểu kỹ hơn. Về phương diện sự nghiệp, tin vào linh cảm khi ra quyết định, tránh vội vàng công khai kế hoạch. Bài học rút ra từ lá bài này: Dành thời gian yên tĩnh để lắng nghe bản thân trước khi hành động.",
"rev":"Bạn đang mất kết nối với trực giác của chính mình, hoặc có những bí mật đang bị che giấu mà bạn cần cẩn trọng. Mặt khuất của lá bài thể hiện qua cảm giác mất kết nối trực giác, bí mật bị che giấu, hời hợt. Điều nên làm lúc này: Dành thời gian yên tĩnh để lắng nghe bản thân trước khi hành động.",
"upE":"một trực giác sâu thẳm và những bí mật chỉ có thể được hiểu bằng sự tĩnh lặng bên trong",
"revE":"sự mất kết nối với trực giác, hoặc những điều bị giấu kín chưa sẵn sàng lộ diện",
"upA":"Dành thời gian tĩnh lặng để lắng nghe điều trực giác đang mách bảo.",
"revA":"Đừng vội phán xét khi sự thật vẫn còn khuất trong bóng tối.","arcana":"major","element":"Nước","suitVi":"","number":2},
"The Empress":{
"up":"Sự sung túc, sáng tạo và nuôi dưỡng đang nở rộ. Đây là năng lượng của mẹ thiên nhiên - chăm sóc bản thân và người khác sẽ mang lại kết quả dồi dào. Về đường tình duyên, tình cảm ấm áp, khả năng mang thai/sinh sản theo nghĩa đen hoặc biểu tượng, sự chăm sóc. Đối với công việc hiện tại, dự án sáng tạo phát triển tốt, môi trường làm việc nuôi dưỡng tài năng. Lời khuyên dành cho bạn: Chăm sóc bản thân trước khi chăm sóc người khác để tránh cạn kiệt.",
"rev":"Bạn có thể đang bế tắc sáng tạo, kiệt sức vì chăm lo cho người khác quá nhiều, hoặc phụ thuộc thái quá vào ai đó. Khi úp ngược, sắc thái xoay quanh những điều như bế tắc sáng tạo, phụ thuộc, mất cân bằng, cạn kiệt. Gợi ý thiết thực: Chăm sóc bản thân trước khi chăm sóc người khác để tránh cạn kiệt.",
"upE":"một sự sung túc dịu dàng, nơi tình yêu và sáng tạo được nuôi dưỡng đơm hoa kết trái",
"revE":"cảm giác cạn kiệt hoặc trì trệ khi bạn cho đi nhiều hơn những gì mình còn giữ lại",
"upA":"Hãy chăm sóc những gì bạn đang vun đắp, kể cả chính bản thân mình.",
"revA":"Dừng lại và bồi đắp năng lượng cho chính mình trước khi cho đi tiếp.","arcana":"major","element":"Đất","suitVi":"","number":3},
"The Emperor":{
"up":"Trật tự, kỷ luật và cấu trúc rõ ràng sẽ giúp bạn đạt được sự ổn định lâu dài. Đây là năng lượng của người lãnh đạo biết xây dựng nền tảng vững chắc. Soi vào các mối quan hệ đang có, mối quan hệ cần ranh giới rõ ràng, hoặc một đối phương có xu hướng kiểm soát. Trong chuyện làm ăn, công việc, vai trò quản lý, xây dựng quy trình, khẳng định vị thế lãnh đạo. Điều nên làm lúc này: Lãnh đạo bằng sự vững vàng chứ không phải bằng sự áp đặt.",
"rev":"Sự độc đoán, cứng nhắc hoặc lạm dụng quyền lực đang gây ra vấn đề. Cũng có thể bạn đang cảm thấy mất kiểm soát với tình huống của mình. Năng lượng ngược lúc này gắn liền với các sắc thái như độc đoán, cứng nhắc, mất kiểm soát, lạm quyền. Bài học rút ra từ lá bài này: Lãnh đạo bằng sự vững vàng chứ không phải bằng sự áp đặt.",
"upE":"một nền tảng vững chắc được xây nên bằng kỷ luật, trách nhiệm và ý chí kiên định",
"revE":"sự cứng nhắc hoặc kiểm soát thái quá đang khiến mọi thứ trở nên ngột ngạt",
"upA":"Đặt ra ranh giới rõ ràng và giữ vững kỷ luật với mục tiêu của mình.",
"revA":"Nới lỏng sự kiểm soát và cho phép người khác có tiếng nói.","arcana":"major","element":"Lửa","suitVi":"","number":4},
"The Hierophant":{
"up":"Truyền thống, giáo dục chính quy hoặc lời khuyên từ người có kinh nghiệm sẽ dẫn đường cho bạn. Đây là lúc tuân theo những giá trị đã được kiểm chứng. Trong tình yêu lúc này, mối quan hệ theo khuôn mẫu truyền thống, hoặc cam kết chính thức (hôn nhân). Về công việc và sự nghiệp, đào tạo, chứng chỉ, làm việc trong hệ thống có cấp bậc rõ ràng. Gợi ý thiết thực: Tôn trọng kinh nghiệm đi trước, nhưng đừng ngại đặt câu hỏi.",
"rev":"Bạn đang muốn phá vỡ quy tắc cũ, nổi loạn chống lại giáo điều, hoặc tìm con đường riêng thay vì đi theo số đông. Ở chiều đảo ngược, những từ khóa nổi bật là nổi loạn, phá vỡ quy tắc, giáo điều, tự do cá nhân. Lời khuyên dành cho bạn: Tôn trọng kinh nghiệm đi trước, nhưng đừng ngại đặt câu hỏi.",
"upE":"sự an toàn và trí tuệ được truyền lại từ những khuôn khổ, truyền thống đã được kiểm chứng",
"revE":"một sự phá vỡ khuôn mẫu cũ, khi quy tắc không còn phù hợp với con đường riêng của bạn",
"upA":"Tìm kiếm một người dẫn dắt hoặc hệ giá trị đáng tin cậy để nương tựa.",
"revA":"Dám đặt câu hỏi với những quy tắc không còn phù hợp với bạn.","arcana":"major","element":"Đất","suitVi":"","number":5},
"The Lovers":{
"up":"Một sự kết nối sâu sắc dựa trên giá trị chung đang xuất hiện, hoặc bạn đang đứng trước một lựa chọn quan trọng cần cân nhắc kỹ bằng cả trái tim và lý trí. Với những ai đang để tâm đến chuyện tình cảm, sự hòa hợp sâu sắc, hoặc một quyết định quan trọng về mối quan hệ. Trên con đường sự nghiệp, hợp tác dựa trên giá trị chung, hoặc lựa chọn giữa hai con đường sự nghiệp. Bài học rút ra từ lá bài này: Chọn theo giá trị cốt lõi của bạn, không chỉ theo cảm xúc nhất thời.",
"rev":"Mất cân bằng trong mối quan hệ, một lựa chọn sai lầm đã hoặc sắp xảy ra, hoặc sự thiếu chân thành đang gây rạn nứt. Mặt khuất của lá bài thể hiện qua cảm giác mất cân bằng, lựa chọn sai lầm, bất hòa, thiếu chân thành. Điều nên làm lúc này: Chọn theo giá trị cốt lõi của bạn, không chỉ theo cảm xúc nhất thời.",
"upE":"một sự hoà hợp sâu sắc và một lựa chọn quan trọng được đưa ra từ trái tim chân thành",
"revE":"sự mất cân bằng hoặc mâu thuẫn giữa những giá trị chưa thể dung hoà",
"upA":"Hãy lựa chọn dựa trên những giá trị thật sự quan trọng với bạn.",
"revA":"Nhìn lại điều gì đang gây mất cân bằng trong mối quan hệ này.","arcana":"major","element":"Khí","suitVi":"","number":6},
"The Chariot":{
"up":"Ý chí mạnh mẽ và sự tập trung sẽ giúp bạn vượt qua trở ngại để giành chiến thắng. Hãy giữ vững tay lái và tiến về phía trước với quyết tâm. Trong chuyện tình cảm, lá bài gợi ý rằng vượt qua trở ngại bên ngoài để giữ mối quan hệ đi đúng hướng. Nhìn sang khía cạnh công việc, thành công nhờ quyết tâm, phù hợp cho đàm phán, cạnh tranh, di chuyển. Lời khuyên dành cho bạn: Xác định rõ mục tiêu và giữ kỷ luật, đừng để phân tâm.",
"rev":"Bạn đang mất phương hướng hoặc để những lực lượng đối lập bên trong kéo bạn về hai hướng khác nhau, khiến hành trình bị đình trệ. Khi úp ngược, sắc thái xoay quanh những điều như mất phương hướng, thiếu kiểm soát, trì trệ, xung đột nội tâm. Gợi ý thiết thực: Xác định rõ mục tiêu và giữ kỷ luật, đừng để phân tâm.",
"upE":"một ý chí kiên định đủ sức chế ngự mọi xung đột để tiến thẳng về đích",
"revE":"sự mất phương hướng khi ý chí bị kéo về quá nhiều ngả cùng lúc",
"upA":"Giữ vững mục tiêu và đừng để những xao nhãng làm chệch hướng.",
"revA":"Xác định lại phương hướng trước khi tiếp tục lao về phía trước.","arcana":"major","element":"Nước","suitVi":"","number":7},
"Strength":{
"up":"Sức mạnh thật sự đến từ sự dịu dàng, kiên nhẫn và lòng trắc ẩn chứ không phải vũ lực. Bạn có khả năng chế ngự khó khăn bằng nội lực vững vàng. Nhìn về phía trái tim, kiên nhẫn và bao dung giúp hàn gắn hoặc củng cố mối quan hệ. Ở môi trường làm việc, giữ bình tĩnh trước áp lực, dùng sự thuyết phục thay vì đối đầu. Điều nên làm lúc này: Đối mặt với nỗi sợ bằng sự dịu dàng thay vì chống cự gay gắt.",
"rev":"Sự nghi ngờ bản thân đang làm suy yếu bạn, hoặc bạn đang cố kiểm soát tình huống bằng cách gây áp lực thay vì kiên nhẫn. Năng lượng ngược lúc này gắn liền với các sắc thái như nghi ngờ bản thân, yếu đuối, mất kiên nhẫn, dùng vũ lực. Bài học rút ra từ lá bài này: Đối mặt với nỗi sợ bằng sự dịu dàng thay vì chống cự gay gắt.",
"upE":"một sức mạnh dịu dàng nhưng bền bỉ, chế ngự mọi bản năng bằng lòng kiên nhẫn",
"revE":"sự nghi ngờ bản thân khi bản năng nóng nảy lấn át sự điềm tĩnh",
"upA":"Đối diện với thử thách bằng sự dịu dàng và lòng kiên nhẫn thay vì ép buộc.",
"revA":"Tìm lại niềm tin vào chính sức mạnh nội tâm của mình.","arcana":"major","element":"Lửa","suitVi":"","number":8},
"The Hermit":{
"up":"Đây là lúc lùi lại, tìm sự tĩnh lặng và tự vấn bản thân để tìm ra chân lý riêng của bạn. Sự cô độc lúc này mang tính xây dựng, không phải trốn tránh. Ở khía cạnh tình yêu, cần không gian riêng để suy ngẫm trước khi tiến xa hơn trong quan hệ. Về phương diện sự nghiệp, nghiên cứu sâu, làm việc độc lập, tìm kiếm định hướng dài hạn. Gợi ý thiết thực: Cho phép bản thân thời gian ở một mình, nhưng đừng đóng cửa hoàn toàn.",
"rev":"Sự cô lập đang trở nên quá mức, khiến bạn xa cách mọi người hoặc từ chối sự giúp đỡ cần thiết. Ở chiều đảo ngược, những từ khóa nổi bật là cô lập quá mức, từ chối giúp đỡ, lạc lối. Lời khuyên dành cho bạn: Cho phép bản thân thời gian ở một mình, nhưng đừng đóng cửa hoàn toàn.",
"upE":"một hành trình lui về nội tâm, nơi ánh sáng trí tuệ soi đường trong sự tĩnh lặng",
"revE":"sự cô lập quá mức khiến bạn lạc lối trong chính những suy nghĩ của mình",
"upA":"Dành thời gian ở một mình để tìm lại tiếng nói bên trong.",
"revA":"Đừng khép mình quá lâu, hãy để ai đó bước vào cùng bạn.","arcana":"major","element":"Đất","suitVi":"","number":9},
"Wheel of Fortune":{
"up":"Một bước ngoặt của số phận đang đến, mang theo thay đổi và cơ hội mới nằm ngoài tầm kiểm soát của bạn. Hãy đón nhận sự vận động tự nhiên của cuộc sống. Về đường tình duyên, một bước ngoặt bất ngờ trong mối quan hệ, tốt hay xấu tùy vào thái độ đón nhận. Đối với công việc hiện tại, cơ hội đến bất ngờ, thời điểm thuận lợi để nắm bắt vận may. Bài học rút ra từ lá bài này: Chấp nhận rằng có những điều nằm ngoài tầm kiểm soát và học cách thích nghi.",
"rev":"Vận rủi tạm thời hoặc cảm giác bị mắc kẹt trong một vòng lặp tiêu cực mà bạn đang cố kháng cự lại thay đổi cần thiết. Mặt khuất của lá bài thể hiện qua cảm giác vận rủi, kháng cự thay đổi, vòng lặp tiêu cực. Điều nên làm lúc này: Chấp nhận rằng có những điều nằm ngoài tầm kiểm soát và học cách thích nghi.",
"upE":"một bước ngoặt của số mệnh, mang đến vận may và những cơ hội đến bất ngờ",
"revE":"một giai đoạn trì trệ hoặc vận rủi khiến mọi thứ dường như ngoài tầm kiểm soát",
"upA":"Đón nhận sự thay đổi, vì bánh xe luôn xoay theo hướng có lợi cho bạn.",
"revA":"Kiên nhẫn chờ đợi, vòng xoay số mệnh rồi sẽ đổi chiều.","arcana":"major","element":"Lửa","suitVi":"","number":10},
"Justice":{
"up":"Sự thật sẽ được phơi bày và mọi hành động đều dẫn đến hậu quả tương xứng. Đây là lúc đưa ra quyết định công bằng, khách quan và chịu trách nhiệm. Soi vào các mối quan hệ đang có, cần sự công bằng, minh bạch và trung thực giữa hai bên. Trong chuyện làm ăn, công việc, vấn đề pháp lý, hợp đồng, hoặc cần quyết định dựa trên sự thật khách quan. Lời khuyên dành cho bạn: Cân nhắc mọi khía cạnh một cách khách quan trước khi phán xét.",
"rev":"Bất công đang xảy ra, hoặc bạn đang né tránh trách nhiệm cho hành động của mình. Có thể có sự thiên vị trong một tình huống nào đó. Khi úp ngược, sắc thái xoay quanh những điều như bất công, thiếu trách nhiệm, thiên vị, trốn tránh hậu quả. Gợi ý thiết thực: Cân nhắc mọi khía cạnh một cách khách quan trước khi phán xét.",
"upE":"một sự công bằng tuyệt đối, nơi mọi hành động đều dẫn đến hệ quả xứng đáng",
"revE":"một sự bất công hoặc hậu quả của những lựa chọn trước đây đang dần lộ diện",
"upA":"Hãy hành động trung thực, vì mọi thứ rồi sẽ được cân bằng lại.",
"revA":"Nhìn thẳng vào hậu quả và chịu trách nhiệm cho lựa chọn của mình.","arcana":"major","element":"Khí","suitVi":"","number":11},
"The Hanged Man":{
"up":"Đôi khi tiến bộ đến từ việc tạm dừng, buông bỏ và nhìn tình huống từ một góc độ hoàn toàn khác. Sự hy sinh tạm thời lúc này sẽ mang lại giác ngộ. Trong tình yêu lúc này, cần thay đổi góc nhìn về mối quan hệ, hoặc tạm dừng để suy xét lại. Về công việc và sự nghiệp, dự án bị đình trệ tạm thời - đây là cơ hội để nhìn nhận lại chiến lược. Điều nên làm lúc này: Chấp nhận tạm dừng thay vì cố gắng ép mọi thứ tiến lên.",
"rev":"Bạn đang trì hoãn một sự buông bỏ cần thiết, hoặc hy sinh mà không mang lại giá trị thực sự nào. Năng lượng ngược lúc này gắn liền với các sắc thái như trì hoãn, chống lại sự cần thiết buông bỏ, hy sinh vô ích. Bài học rút ra từ lá bài này: Chấp nhận tạm dừng thay vì cố gắng ép mọi thứ tiến lên.",
"upE":"một khoảng dừng cần thiết để nhìn cuộc sống từ một góc độ hoàn toàn khác",
"revE":"cảm giác mắc kẹt khi bạn không chịu buông bỏ những điều đã lỗi thời",
"upA":"Tạm dừng lại, đổi góc nhìn trước khi vội vàng hành động.",
"revA":"Học cách buông bỏ những gì đang giữ chân bạn lại.","arcana":"major","element":"Nước","suitVi":"","number":12},
"Death":{
"up":"Một chương quan trọng đang khép lại để mở đường cho sự chuyển hóa và khởi đầu mới. Đừng sợ kết thúc - nó là điều kiện cần để tái sinh. Với những ai đang để tâm đến chuyện tình cảm, kết thúc một giai đoạn để mối quan hệ bước sang trạng thái mới, hoặc chia tay cần thiết. Trên con đường sự nghiệp, kết thúc một công việc, dự án hoặc phương pháp cũ để mở ra hướng đi mới. Gợi ý thiết thực: Buông bỏ những gì đã hoàn thành vai trò của nó để đón nhận điều mới.",
"rev":"Sự sợ hãi thay đổi đang khiến bạn bám víu vào những gì đã lỗi thời, gây ra trì trệ và cản trở quá trình chuyển hóa tự nhiên. Ở chiều đảo ngược, những từ khóa nổi bật là sợ thay đổi, trì trệ, cản trở chuyển hóa, bám víu quá khứ. Lời khuyên dành cho bạn: Buông bỏ những gì đã hoàn thành vai trò của nó để đón nhận điều mới.",
"upE":"một sự kết thúc tất yếu, khép lại hoàn toàn một chương để nhường chỗ cho sự tái sinh",
"revE":"một sự chống cự trước kết thúc không thể tránh khỏi, khiến nỗi đau kéo dài hơn cần thiết",
"upA":"Chấp nhận buông bỏ hoàn toàn để mở đường cho khởi đầu mới.",
"revA":"Ngừng níu kéo điều đã kết thúc, vì càng chống cự càng đau.","arcana":"major","element":"Nước","suitVi":"","number":13},
"Temperance":{
"up":"Sự pha trộn hài hòa giữa các thái cực đối lập đang mang lại cân bằng và bình yên. Kiên nhẫn và điều độ là chìa khóa lúc này. Trong chuyện tình cảm, lá bài gợi ý rằng cần sự thỏa hiệp và kiên nhẫn để dung hòa những khác biệt. Nhìn sang khía cạnh công việc, hợp tác đa bên, cần cách tiếp cận điều độ và từ tốn thay vì vội vàng. Bài học rút ra từ lá bài này: Tìm điểm trung dung thay vì nghiêng hẳn về một cực đoan nào.",
"rev":"Sự mất cân bằng, thái quá về một mặt nào đó (công việc, cảm xúc, thói quen) đang gây ra căng thẳng nội tâm. Mặt khuất của lá bài thể hiện qua cảm giác mất cân bằng, thái quá, xung đột nội tâm, thiếu kiên nhẫn. Điều nên làm lúc này: Tìm điểm trung dung thay vì nghiêng hẳn về một cực đoan nào.",
"upE":"một sự cân bằng hài hoà được tạo nên từ kiên nhẫn pha trộn mọi thái cực",
"revE":"sự mất cân bằng khi một khía cạnh nào đó của cuộc sống trở nên thái quá",
"upA":"Kiên nhẫn điều hoà mọi thứ, đừng vội vàng ép buộc kết quả.",
"revA":"Tìm lại điểm cân bằng đã bị lệch trong cuộc sống của bạn.","arcana":"major","element":"Lửa","suitVi":"","number":14},
"The Devil":{
"up":"Bạn đang bị ràng buộc bởi cám dỗ, thói quen xấu hoặc một mối quan hệ độc hại mà bản thân khó dứt ra, dù về bản chất sự ràng buộc này do chính bạn tạo nên. Nhìn về phía trái tim, mối quan hệ phụ thuộc, ghen tuông hoặc thu hút thể xác mạnh mẽ nhưng thiếu lành mạnh. Ở môi trường làm việc, cảm giác mắc kẹt trong công việc vì lý do tài chính, thiếu tự do. Lời khuyên dành cho bạn: Nhận diện điều gì đang trói buộc bạn - đó là bước đầu để giải thoát.",
"rev":"Bạn đang bắt đầu nhận ra những ràng buộc của mình và tìm cách giải phóng bản thân khỏi thói quen hoặc mối quan hệ độc hại. Khi úp ngược, sắc thái xoay quanh những điều như giải phóng, nhận ra ràng buộc, phá vỡ thói quen xấu. Gợi ý thiết thực: Nhận diện điều gì đang trói buộc bạn - đó là bước đầu để giải thoát.",
"upE":"một sự trói buộc bởi ham muốn hoặc thói quen, một xiềng xích do chính bạn tạo ra",
"revE":"một bước giải thoát khi bạn nhận ra sức mạnh để cắt đứt điều đang trói buộc mình",
"upA":"Nhận diện điều đang trói buộc bạn trước khi có thể thoát khỏi nó.",
"revA":"Dũng cảm cắt đứt sợi dây ràng buộc đã không còn phục vụ bạn.","arcana":"major","element":"Đất","suitVi":"","number":15},
"The Tower":{
"up":"Một biến cố bất ngờ làm sụp đổ những nền tảng ảo tưởng, phơi bày sự thật mà bạn đã né tránh. Dù đau đớn, đây là sự phá vỡ cần thiết để xây dựng lại vững chắc hơn. Ở khía cạnh tình yêu, một sự thật gây sốc làm thay đổi hoàn toàn mối quan hệ. Về phương diện sự nghiệp, biến động bất ngờ như mất việc, thay đổi tổ chức đột ngột. Điều nên làm lúc này: Đối mặt trực tiếp với khủng hoảng thay vì né tránh, vì nó sẽ dẫn đến điều tốt hơn.",
"rev":"Bạn đang cố tránh né một cuộc khủng hoảng sắp xảy ra, nhưng sự trì hoãn này có thể khiến hậu quả tích tụ lớn hơn. Năng lượng ngược lúc này gắn liền với các sắc thái như tránh né khủng hoảng, sợ thay đổi, thảm họa bị trì hoãn. Bài học rút ra từ lá bài này: Đối mặt trực tiếp với khủng hoảng thay vì né tránh, vì nó sẽ dẫn đến điều tốt hơn.",
"upE":"một sự sụp đổ đột ngột phá vỡ mọi ảo tưởng để mở đường cho sự thật",
"revE":"một sự né tránh đổ vỡ tất yếu, khiến nỗi đau âm ỉ kéo dài thay vì được giải thoát",
"upA":"Để những gì cần sụp đổ được sụp đổ, rồi xây lại vững vàng hơn.",
"revA":"Đối diện với sự thật thay vì tiếp tục né tránh nó.","arcana":"major","element":"Lửa","suitVi":"","number":16},
"The Star":{
"up":"Sau giai đoạn khó khăn, hy vọng và sự chữa lành đang xuất hiện. Hãy tin tưởng vào tương lai và để cảm hứng dẫn lối cho bạn. Về đường tình duyên, hy vọng về một tương lai tươi sáng hơn cho mối quan hệ, sự chân thành trở lại. Đối với công việc hiện tại, cảm hứng mới mẻ, dự án mang tính lý tưởng, phục hồi sau khó khăn. Gợi ý thiết thực: Giữ vững niềm tin ngay cả khi kết quả chưa rõ ràng.",
"rev":"Bạn đang cảm thấy tuyệt vọng hoặc mất niềm tin vào tương lai, cảm giác thiếu định hướng và kiệt sức về tinh thần. Ở chiều đảo ngược, những từ khóa nổi bật là tuyệt vọng, mất niềm tin, thiếu định hướng, kiệt sức. Lời khuyên dành cho bạn: Giữ vững niềm tin ngay cả khi kết quả chưa rõ ràng.",
"upE":"một niềm hy vọng lặng lẽ được thắp sáng sau cơn bão, chữa lành và dẫn lối về tương lai",
"revE":"một sự mất niềm tin, hoài nghi liệu ánh sáng có còn le lói phía trước",
"upA":"Giữ vững niềm tin, ánh sáng đang dẫn lối bạn từng bước một.",
"revA":"Cho phép bản thân được chữa lành trước khi tin tưởng trở lại.","arcana":"major","element":"Khí","suitVi":"","number":17},
"The Moon":{
"up":"Có những điều chưa rõ ràng, dễ gây hiểu lầm hoặc lo lắng vô cớ. Hãy thận trọng với ảo giác và lắng nghe trực giác nhưng đừng vội kết luận. Soi vào các mối quan hệ đang có, sự không chắc chắn, nghi ngờ hoặc điều gì đó chưa được nói ra hết. Trong chuyện làm ăn, công việc, tình huống mập mờ, thiếu thông tin rõ ràng, cần thêm thời gian xác minh. Bài học rút ra từ lá bài này: Đừng để nỗi sợ hoặc tin đồn dẫn dắt quyết định của bạn - hãy tìm sự thật.",
"rev":"Sự nhầm lẫn, sợ hãi hoặc bí mật trước đó đang dần được sáng tỏ, giúp bạn nhìn nhận vấn đề rõ ràng hơn. Mặt khuất của lá bài thể hiện qua cảm giác nhầm lẫn được giải tỏa, sự thật dần sáng tỏ, vượt qua sợ hãi. Điều nên làm lúc này: Đừng để nỗi sợ hoặc tin đồn dẫn dắt quyết định của bạn - hãy tìm sự thật.",
"upE":"một thế giới mơ hồ của tiềm thức, nơi nỗi sợ và ảo giác che mờ sự thật",
"revE":"một sự thật đang dần được hé lộ khi màn sương ảo tưởng bắt đầu tan biến",
"upA":"Tin vào trực giác nhưng đừng để nỗi sợ dẫn dắt hành động.",
"revA":"Nhìn thẳng vào sự thật đang dần lộ diện trước mắt bạn.","arcana":"major","element":"Nước","suitVi":"","number":18},
"The Sun":{
"up":"Niềm vui, sự thành công và nguồn năng lượng tích cực đang chiếu sáng con đường của bạn. Mọi thứ trở nên rõ ràng và đầy hứa hẹn. Trong tình yêu lúc này, hạnh phúc, sự chân thành và niềm vui chung trong mối quan hệ. Về công việc và sự nghiệp, thành công được công nhận, dự án tiến triển thuận lợi và rõ ràng. Lời khuyên dành cho bạn: Tận hưởng thành quả nhưng vẫn giữ sự khiêm tốn và tỉnh táo.",
"rev":"Một đám mây u ám tạm thời che khuất niềm vui, hoặc sự tự tin thái quá đang khiến bạn bỏ qua chi tiết quan trọng. Khi úp ngược, sắc thái xoay quanh những điều như u ám tạm thời, tự tin thái quá, trì hoãn niềm vui. Gợi ý thiết thực: Tận hưởng thành quả nhưng vẫn giữ sự khiêm tốn và tỉnh táo.",
"upE":"một niềm vui trọn vẹn và nguồn năng lượng rực rỡ chiếu sáng khắp mọi ngóc ngách",
"revE":"một niềm vui bị che khuất tạm thời, cần thời gian để ánh sáng quay trở lại",
"upA":"Tận hưởng thành quả và chia sẻ niềm vui ấy với những người xung quanh.",
"revA":"Kiên nhẫn chờ đợi, ánh nắng rồi sẽ trở lại chiếu sáng con đường bạn đi.","arcana":"major","element":"Lửa","suitVi":"","number":19},
"Judgement":{
"up":"Một lời gọi thức tỉnh đang thôi thúc bạn nhìn lại quá khứ, tha thứ và bước vào một phiên bản mới của chính mình. Với những ai đang để tâm đến chuyện tình cảm, sự tha thứ, hàn gắn hoặc quyết định quan trọng dựa trên nhìn lại quá khứ. Trên con đường sự nghiệp, đánh giá lại con đường sự nghiệp, có thể là một lời mời gọi thay đổi lớn. Điều nên làm lúc này: Nhìn lại quá khứ với lòng khoan dung để tiến về phía trước nhẹ nhàng hơn.",
"rev":"Bạn đang tự phán xét bản thân quá khắt khe hoặc sợ đối mặt với thay đổi cần thiết để tái sinh. Năng lượng ngược lúc này gắn liền với các sắc thái như tự phán xét khắt khe, sợ thay đổi, bỏ lỡ cơ hội chuộc lỗi. Bài học rút ra từ lá bài này: Nhìn lại quá khứ với lòng khoan dung để tiến về phía trước nhẹ nhàng hơn.",
"upE":"một lời thức tỉnh, thời khắc nhìn lại và tha thứ để bước vào phiên bản mới của chính mình",

"Eight of Cups":{

"rev":"Về cảm xúc, tình yêu và trực giác, trì trệ, tin tức bị trì hoãn hoặc cảm giác bế tắc không lối thoát. Khi úp ngược, sắc thái xoay quanh những điều như trì trệ, chậm trễ, bế tắc. Gợi ý thiết thực: Lắng nghe cảm xúc của bản thân và người khác trước khi quyết định.",
"upE":"một sự rời bỏ những gì không còn ý nghĩa để tìm kiếm điều sâu sắc hơn",
"revE":"một sự do dự trước khi rời đi, sợ hãi trước những điều chưa biết",
"upA":"Can đảm rời xa những gì không còn phục vụ hành trình của bạn.",
"revA":"Đối diện với nỗi sợ thay vì quay lại điều đã từng buông bỏ.","arcana":"minor","element":"Nước","suitVi":"Ly","number":8},
"Nine of Cups":{
"up":"Về cảm xúc, tình yêu và trực giác, kiên cường, gần đạt được mục tiêu dù đã mệt mỏi và cần thận trọng. Ở khía cạnh tình yêu, cảm xúc, sự gắn kết và chiều sâu tình cảm trong mối quan hệ. Về phương diện sự nghiệp, công việc mang tính sáng tạo, chăm sóc con người hoặc nghệ thuật. Điều nên làm lúc này: Lắng nghe cảm xúc của bản thân và người khác trước khi quyết định.",
"rev":"Về cảm xúc, tình yêu và trực giác, kiệt sức, hoang mang hoặc mất niềm tin ngay trước ngưỡng thành công. Năng lượng ngược lúc này gắn liền với các sắc thái như kiệt sức, hoang mang, mất niềm tin. Bài học rút ra từ lá bài này: Lắng nghe cảm xúc của bản thân và người khác trước khi quyết định.",
"upE":"một sự mãn nguyện trọn vẹn, những ước nguyện đã thành hiện thực và mang lại hạnh phúc",
"revE":"một sự mãn nguyện hời hợt, cảm giác trống rỗng dù đã đạt được điều mong muốn",
"upA":"Tận hưởng trọn vẹn niềm hạnh phúc mà bạn đã xứng đáng có được.",
"revA":"Tìm kiếm sự mãn nguyện thật sự thay vì vẻ ngoài hào nhoáng.","arcana":"minor","element":"Nước","suitVi":"Ly","number":9},
"Ten of Cups":{
"up":"Về cảm xúc, tình yêu và trực giác, hoàn thành một chu kỳ, dù có thể đi kèm gánh nặng hoặc trách nhiệm lớn. Về đường tình duyên, cảm xúc, sự gắn kết và chiều sâu tình cảm trong mối quan hệ. Đối với công việc hiện tại, công việc mang tính sáng tạo, chăm sóc con người hoặc nghệ thuật. Gợi ý thiết thực: Lắng nghe cảm xúc của bản thân và người khác trước khi quyết định.",
"rev":"Về cảm xúc, tình yêu và trực giác, giải phóng bớt gánh nặng, hoặc cảm giác quá tải kéo dài chưa được giải quyết. Ở chiều đảo ngược, những từ khóa nổi bật là giải tỏa gánh nặng, quá tải, kiệt sức kéo dài. Lời khuyên dành cho bạn: Lắng nghe cảm xúc của bản thân và người khác trước khi quyết định.",
"upE":"một hạnh phúc trọn vẹn, một bức tranh gia đình viên mãn mà bạn từng dày công vun đắp",
"revE":"một rạn nứt trong hạnh phúc gia đình, những giá trị từng gắn kết nay lung lay",
"upA":"Trân trọng và tiếp tục vun đắp hạnh phúc mà bạn đang có.",
"revA":"Hàn gắn lại những giá trị đã từng gắn kết mọi người.","arcana":"minor","element":"Nước","suitVi":"Ly","number":10},
"Page of Cups":{
"up":"Về cảm xúc, tình yêu và trực giác, một tin tức mới, sự tò mò và tinh thần học hỏi non trẻ trong lĩnh vực của chất bài này. Soi vào các mối quan hệ đang có, cảm xúc, sự gắn kết và chiều sâu tình cảm trong mối quan hệ. Trong chuyện làm ăn, công việc, công việc mang tính sáng tạo, chăm sóc con người hoặc nghệ thuật. Bài học rút ra từ lá bài này: Lắng nghe cảm xúc của bản thân và người khác trước khi quyết định.",
"rev":"Về cảm xúc, tình yêu và trực giác, tin tức chưa chắc chắn, sự thiếu chín chắn hoặc do dự trước điều mới mẻ. Mặt khuất của lá bài thể hiện qua cảm giác thiếu chín chắn, do dự, tin đồn. Điều nên làm lúc này: Lắng nghe cảm xúc của bản thân và người khác trước khi quyết định.",
"upE":"một thông điệp cảm xúc dịu dàng, sự nhạy cảm trẻ trung mở lòng đón nhận điều mới",
"revE":"một sự nhạy cảm thái quá dẫn đến tổn thương, cảm xúc chưa đủ chín chắn",
"upA":"Mở lòng đón nhận thông điệp cảm xúc đang đến với bạn.",
"revA":"Học cách bảo vệ cảm xúc của mình mà không đóng kín trái tim.","arcana":"minor","element":"Nước","suitVi":"Ly","number":null},
"Knight of Cups":{
"up":"Về cảm xúc, tình yêu và trực giác, hành động quyết liệt, theo đuổi mục tiêu với nhiệt huyết đặc trưng của chất bài này. Trong tình yêu lúc này, cảm xúc, sự gắn kết và chiều sâu tình cảm trong mối quan hệ. Về công việc và sự nghiệp, công việc mang tính sáng tạo, chăm sóc con người hoặc nghệ thuật. Lời khuyên dành cho bạn: Lắng nghe cảm xúc của bản thân và người khác trước khi quyết định.",
"rev":"Về cảm xúc, tình yêu và trực giác, hành động bốc đồng, thiếu kiên nhẫn hoặc theo đuổi một cách cực đoan. Khi úp ngược, sắc thái xoay quanh những điều như bốc đồng, cực đoan, thiếu kiên nhẫn. Gợi ý thiết thực: Lắng nghe cảm xúc của bản thân và người khác trước khi quyết định.",
"upE":"một lời mời lãng mạn, theo đuổi cảm xúc và lý tưởng bằng cả trái tim",
"revE":"một sự thất thường trong cảm xúc, những lời hứa hẹn thiếu hành động thực chất",
"upA":"Theo đuổi điều trái tim mách bảo bằng sự chân thành.",
"revA":"Nhìn vào hành động thực tế thay vì chỉ những lời hứa hẹn.","arcana":"minor","element":"Nước","suitVi":"Ly","number":null},
"Queen of Cups":{
"up":"Về cảm xúc, tình yêu và trực giác, sự trưởng thành, thấu hiểu sâu sắc và khả năng nuôi dưỡng năng lượng của chất bài này từ bên trong. Với những ai đang để tâm đến chuyện tình cảm, cảm xúc, sự gắn kết và chiều sâu tình cảm trong mối quan hệ. Trên con đường sự nghiệp, công việc mang tính sáng tạo, chăm sóc con người hoặc nghệ thuật. Điều nên làm lúc này: Lắng nghe cảm xúc của bản thân và người khác trước khi quyết định.",
"rev":"Về cảm xúc, tình yêu và trực giác, mất kết nối với bản chất của chính mình, hoặc bộc lộ theo hướng thái quá, thiếu lành mạnh. Năng lượng ngược lúc này gắn liền với các sắc thái như mất kết nối bản thân, thái quá, bất an nội tâm. Bài học rút ra từ lá bài này: Lắng nghe cảm xúc của bản thân và người khác trước khi quyết định.",
"upE":"một sự thấu cảm sâu sắc, trái tim luôn rộng mở để yêu thương và chữa lành",
"revE":"một sự mất ranh giới cảm xúc, dễ bị cuốn đi bởi cảm xúc của người khác",
"upA":"Dùng sự thấu cảm của mình để chữa lành, cho bản thân lẫn người khác.",
"revA":"Đặt ra ranh giới cảm xúc rõ ràng để bảo vệ chính mình.","arcana":"minor","element":"Nước","suitVi":"Ly","number":null},
"King of Cups":{
"up":"Về cảm xúc, tình yêu và trực giác, sự làm chủ, quyền lực vững vàng và khả năng dẫn dắt bằng kinh nghiệm trong lĩnh vực này. Trong chuyện tình cảm, lá bài gợi ý rằng cảm xúc, sự gắn kết và chiều sâu tình cảm trong mối quan hệ. Nhìn sang khía cạnh công việc, công việc mang tính sáng tạo, chăm sóc con người hoặc nghệ thuật. Gợi ý thiết thực: Lắng nghe cảm xúc của bản thân và người khác trước khi quyết định.",
"rev":"Về cảm xúc, tình yêu và trực giác, lạm dụng quyền lực, độc đoán hoặc thiếu cảm xúc/khô khan khi thực thi quyền lực. Ở chiều đảo ngược, những từ khóa nổi bật là độc đoán, lạm quyền, khô khan. Lời khuyên dành cho bạn: Lắng nghe cảm xúc của bản thân và người khác trước khi quyết định.",
"upE":"một sự điềm tĩnh trưởng thành, dẫn dắt bằng trái tim nhưng không để cảm xúc chi phối",
"revE":"một cảm xúc bị kìm nén phía sau vẻ ngoài điềm tĩnh",
"upA":"Cân bằng giữa lý trí và cảm xúc trong mọi quyết định.",
"revA":"Cho phép bản thân bộc lộ cảm xúc thay vì kìm nén chúng.","arcana":"minor","element":"Nước","suitVi":"Ly","number":null},
"Ace of Swords":{
"up":"Về trí tuệ, xung đột và sự thật, một khởi đầu mới đầy tiềm năng, hạt giống thuần khiết của năng lượng chất bài này. Nhìn về phía trái tim, giao tiếp thẳng thắn, xung đột cần giải quyết bằng lý trí. Ở môi trường làm việc, đàm phán, ra quyết định dựa trên phân tích và sự thật. Bài học rút ra từ lá bài này: Nói sự thật một cách khéo léo, tránh để cảm xúc chi phối lý trí.",
"rev":"Về trí tuệ, xung đột và sự thật, cơ hội bị bỏ lỡ, khởi đầu chậm trễ hoặc năng lượng chưa được khơi thông. Mặt khuất của lá bài thể hiện qua cảm giác cơ hội bị bỏ lỡ, khởi đầu trì trệ, chặn dòng năng lượng. Điều nên làm lúc này: Nói sự thật một cách khéo léo, tránh để cảm xúc chi phối lý trí.",
"upE":"một sự thật sáng rõ, tư duy sắc bén cắt đứt mọi mơ hồ để nhìn thấu vấn đề",
"revE":"một sự nhầm lẫn trong tư duy, sự thật bị bóp méo khiến quyết định sai lệch",
"upA":"Dùng sự sáng suốt này để đưa ra quyết định rõ ràng, dứt khoát.",
"revA":"Xem xét lại thông tin trước khi tin vào những gì có vẻ hiển nhiên.","arcana":"minor","element":"Khí","suitVi":"Kiếm","number":1},
"Two of Swords":{
"up":"Về trí tuệ, xung đột và sự thật, lên kế hoạch, cân nhắc lựa chọn và tầm nhìn xa cho bước tiếp theo. Ở khía cạnh tình yêu, giao tiếp thẳng thắn, xung đột cần giải quyết bằng lý trí. Về phương diện sự nghiệp, đàm phán, ra quyết định dựa trên phân tích và sự thật. Lời khuyên dành cho bạn: Nói sự thật một cách khéo léo, tránh để cảm xúc chi phối lý trí.",
"rev":"Về trí tuệ, xung đột và sự thật, do dự kéo dài, thiếu quyết đoán hoặc mất cân bằng giữa các lựa chọn. Khi úp ngược, sắc thái xoay quanh những điều như do dự, mất cân bằng, trì hoãn quyết định. Gợi ý thiết thực: Nói sự thật một cách khéo léo, tránh để cảm xúc chi phối lý trí.",
"upE":"một sự bế tắc giữa hai lựa chọn, cố tình nhắm mắt để tránh né quyết định khó khăn",
"revE":"một sự mở mắt nhìn nhận sự thật, sẵn sàng phá vỡ thế bế tắc đã kéo dài",
"upA":"Mở mắt nhìn thẳng vào vấn đề và đưa ra quyết định.",
"revA":"Đối diện với sự thật đã trốn tránh quá lâu.","arcana":"minor","element":"Khí","suitVi":"Kiếm","number":2},
"Three of Swords":{
"up":"Về trí tuệ, xung đột và sự thật, mở rộng, hợp tác và bắt đầu thấy kết quả ban đầu từ nỗ lực đã bỏ ra. Về đường tình duyên, giao tiếp thẳng thắn, xung đột cần giải quyết bằng lý trí. Đối với công việc hiện tại, đàm phán, ra quyết định dựa trên phân tích và sự thật. Điều nên làm lúc này: Nói sự thật một cách khéo léo, tránh để cảm xúc chi phối lý trí.",
"rev":"Về trí tuệ, xung đột và sự thật, chậm trễ trong hợp tác, kỳ vọng chưa được đáp ứng hoặc thiếu sự phối hợp. Năng lượng ngược lúc này gắn liền với các sắc thái như chậm trễ, thất vọng nhẹ, thiếu phối hợp. Bài học rút ra từ lá bài này: Nói sự thật một cách khéo léo, tránh để cảm xúc chi phối lý trí.",
"upE":"một nỗi đau chia lìa xuyên thấu trái tim, một sự thật phũ phàng gây tổn thương",
"revE":"một vết thương đang dần được chữa lành, học cách tha thứ để giải phóng bản thân",
"upA":"Cho phép bản thân đau buồn, đó là bước đầu của chữa lành.",
"revA":"Tha thứ để giải phóng chính mình khỏi nỗi đau cũ.","arcana":"minor","element":"Khí","suitVi":"Kiếm","number":3},
"Four of Swords":{
"up":"Về trí tuệ, xung đột và sự thật, ổn định, ăn mừng và cảm giác an toàn sau một giai đoạn nỗ lực. Soi vào các mối quan hệ đang có, giao tiếp thẳng thắn, xung đột cần giải quyết bằng lý trí. Trong chuyện làm ăn, công việc, đàm phán, ra quyết định dựa trên phân tích và sự thật. Gợi ý thiết thực: Nói sự thật một cách khéo léo, tránh để cảm xúc chi phối lý trí.",
"rev":"Về trí tuệ, xung đột và sự thật, mất ổn định tạm thời, trì hoãn lễ ăn mừng hoặc cảm giác chưa an toàn. Ở chiều đảo ngược, những từ khóa nổi bật là bất ổn, trì hoãn, thiếu gắn kết. Lời khuyên dành cho bạn: Nói sự thật một cách khéo léo, tránh để cảm xúc chi phối lý trí.",
"upE":"một khoảng nghỉ cần thiết để phục hồi, tạm rút lui để tâm trí được tĩnh lặng",
"revE":"một sự nghỉ ngơi bị gián đoạn, kiệt sức vì chưa cho bản thân dừng lại đủ lâu",
"upA":"Cho phép bản thân nghỉ ngơi trọn vẹn trước khi tiếp tục.",
"revA":"Ưu tiên sự phục hồi thay vì tiếp tục ép mình làm việc.","arcana":"minor","element":"Khí","suitVi":"Kiếm","number":4},
"Five of Swords":{
"up":"Về trí tuệ, xung đột và sự thật, cạnh tranh, xung đột hoặc thử thách cần vượt qua để trưởng thành. Trong tình yêu lúc này, giao tiếp thẳng thắn, xung đột cần giải quyết bằng lý trí. Về công việc và sự nghiệp, đàm phán, ra quyết định dựa trên phân tích và sự thật. Bài học rút ra từ lá bài này: Nói sự thật một cách khéo léo, tránh để cảm xúc chi phối lý trí.",
"rev":"Về trí tuệ, xung đột và sự thật, xung đột được hóa giải, hoặc mệt mỏi kéo dài vì tranh đấu không hồi kết. Mặt khuất của lá bài thể hiện qua cảm giác hóa giải xung đột, mệt mỏi, tránh né đối đầu. Điều nên làm lúc này: Nói sự thật một cách khéo léo, tránh để cảm xúc chi phối lý trí.",

"Six of Swords":{

"Seven of Swords":{
"up":"Về trí tuệ, xung đột và sự thật, kiên trì, đánh giá lại chiến lược và giữ vững lập trường trước thử thách. Trong chuyện tình cảm, lá bài gợi ý rằng giao tiếp thẳng thắn, xung đột cần giải quyết bằng lý trí. Nhìn sang khía cạnh công việc, đàm phán, ra quyết định dựa trên phân tích và sự thật. Điều nên làm lúc này: Nói sự thật một cách khéo léo, tránh để cảm xúc chi phối lý trí.",

"Eight of Swords":{
"up":"Về trí tuệ, xung đột và sự thật, tiến triển nhanh chóng, tin tức mới hoặc giai đoạn bận rộn hiệu quả. Nhìn về phía trái tim, giao tiếp thẳng thắn, xung đột cần giải quyết bằng lý trí. Ở môi trường làm việc, đàm phán, ra quyết định dựa trên phân tích và sự thật. Gợi ý thiết thực: Nói sự thật một cách khéo léo, tránh để cảm xúc chi phối lý trí.",

"Ten of Swords":{

"Three of Pentacles":{
"up":"Về vật chất, tài chính và công việc, mở rộng, hợp tác và bắt đầu thấy kết quả ban đầu từ nỗ lực đã bỏ ra. Về đường tình duyên, sự ổn định, cam kết lâu dài và nền tảng vật chất cho tình cảm. Đối với công việc hiện tại, tài chính, đầu tư dài hạn, xây dựng sự nghiệp bền vững. Bài học rút ra từ lá bài này: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"rev":"Về vật chất, tài chính và công việc, chậm trễ trong hợp tác, kỳ vọng chưa được đáp ứng hoặc thiếu sự phối hợp. Mặt khuất của lá bài thể hiện qua cảm giác chậm trễ, thất vọng nhẹ, thiếu phối hợp. Điều nên làm lúc này: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"upE":"một sự hợp tác hiệu quả, thành quả vượt xa những gì có thể làm được một mình",
"revE":"một sự thiếu phối hợp, công sức không được công nhận đúng mức",
"upA":"Hợp tác chặt chẽ với những người cùng chung mục tiêu.",
"revA":"Tìm cách cải thiện sự phối hợp và giao tiếp trong nhóm.","arcana":"minor","element":"Đất","suitVi":"Tiền","number":3},
"Four of Pentacles":{
"up":"Về vật chất, tài chính và công việc, ổn định, ăn mừng và cảm giác an toàn sau một giai đoạn nỗ lực. Soi vào các mối quan hệ đang có, sự ổn định, cam kết lâu dài và nền tảng vật chất cho tình cảm. Trong chuyện làm ăn, công việc, tài chính, đầu tư dài hạn, xây dựng sự nghiệp bền vững. Lời khuyên dành cho bạn: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"rev":"Về vật chất, tài chính và công việc, mất ổn định tạm thời, trì hoãn lễ ăn mừng hoặc cảm giác chưa an toàn. Khi úp ngược, sắc thái xoay quanh những điều như bất ổn, trì hoãn, thiếu gắn kết. Gợi ý thiết thực: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"upE":"một sự nắm giữ chặt những gì đã có, thận trọng về tài chính nhưng có thể trở nên keo kiệt",
"revE":"một sự buông lỏng kiểm soát vật chất, học cách chia sẻ thay vì bám giữ",
"upA":"Cân bằng giữa tiết kiệm và cho phép bản thân tận hưởng.",
"revA":"Học cách buông tay và chia sẻ những gì mình đang có.","arcana":"minor","element":"Đất","suitVi":"Tiền","number":4},
"Five of Pentacles":{
"up":"Về vật chất, tài chính và công việc, cạnh tranh, xung đột hoặc thử thách cần vượt qua để trưởng thành. Trong tình yêu lúc này, sự ổn định, cam kết lâu dài và nền tảng vật chất cho tình cảm. Về công việc và sự nghiệp, tài chính, đầu tư dài hạn, xây dựng sự nghiệp bền vững. Điều nên làm lúc này: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"rev":"Về vật chất, tài chính và công việc, xung đột được hóa giải, hoặc mệt mỏi kéo dài vì tranh đấu không hồi kết. Năng lượng ngược lúc này gắn liền với các sắc thái như hóa giải xung đột, mệt mỏi, tránh né đối đầu. Bài học rút ra từ lá bài này: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"upE":"một khó khăn về vật chất hoặc tinh thần khiến bạn cảm thấy bị bỏ rơi, lạc lõng",
"revE":"một sự tìm thấy hỗ trợ sau giai đoạn khó khăn, ánh sáng cuối đường hầm đang ló dạng",
"upA":"Tìm kiếm sự giúp đỡ, bạn không cần phải một mình vượt qua.",
"revA":"Đón nhận sự hỗ trợ đang dần xuất hiện quanh bạn.","arcana":"minor","element":"Đất","suitVi":"Tiền","number":5},
"Six of Pentacles":{
"up":"Về vật chất, tài chính và công việc, chiến thắng, được công nhận hoặc tìm lại sự hài hòa sau khó khăn. Với những ai đang để tâm đến chuyện tình cảm, sự ổn định, cam kết lâu dài và nền tảng vật chất cho tình cảm. Trên con đường sự nghiệp, tài chính, đầu tư dài hạn, xây dựng sự nghiệp bền vững. Gợi ý thiết thực: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"rev":"Về vật chất, tài chính và công việc, chiến thắng chưa trọn vẹn, thiếu sự công nhận xứng đáng hoặc hoài niệm quá khứ. Ở chiều đảo ngược, những từ khóa nổi bật là thiếu công nhận, hoài niệm, chiến thắng nửa vời. Lời khuyên dành cho bạn: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"upE":"một sự cho và nhận cân bằng, hào phóng chia sẻ với những người cần giúp đỡ",
"revE":"một sự mất cân bằng trong cho và nhận, một mối quan hệ phụ thuộc hoặc có điều kiện",
"upA":"Chia sẻ với lòng hào phóng nhưng đừng quên chăm sóc bản thân.",
"revA":"Xem xét lại sự cân bằng trong việc cho và nhận của bạn.","arcana":"minor","element":"Đất","suitVi":"Tiền","number":6},
"Seven of Pentacles":{
"up":"Về vật chất, tài chính và công việc, kiên trì, đánh giá lại chiến lược và giữ vững lập trường trước thử thách. Trong chuyện tình cảm, lá bài gợi ý rằng sự ổn định, cam kết lâu dài và nền tảng vật chất cho tình cảm. Nhìn sang khía cạnh công việc, tài chính, đầu tư dài hạn, xây dựng sự nghiệp bền vững. Bài học rút ra từ lá bài này: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"rev":"Về vật chất, tài chính và công việc, từ bỏ quá sớm, thiếu chiến lược rõ ràng hoặc bị áp đảo bởi khó khăn. Mặt khuất của lá bài thể hiện qua cảm giác từ bỏ, thiếu chiến lược, bị áp đảo. Điều nên làm lúc này: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"upE":"một sự kiên nhẫn đánh giá lại thành quả đã gieo trồng trước khi tiếp tục đầu tư",
"revE":"một sự thiếu kiên nhẫn, muốn từ bỏ ngay trước khi thành quả kịp chín muồi",
"upA":"Kiên nhẫn đánh giá lại trước khi quyết định bước tiếp theo.",
"revA":"Đừng từ bỏ ngay trước khi thành quả kịp chín muồi.","arcana":"minor","element":"Đất","suitVi":"Tiền","number":7},
"Eight of Pentacles":{
"up":"Về vật chất, tài chính và công việc, tiến triển nhanh chóng, tin tức mới hoặc giai đoạn bận rộn hiệu quả. Nhìn về phía trái tim, sự ổn định, cam kết lâu dài và nền tảng vật chất cho tình cảm. Ở môi trường làm việc, tài chính, đầu tư dài hạn, xây dựng sự nghiệp bền vững. Lời khuyên dành cho bạn: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"rev":"Về vật chất, tài chính và công việc, trì trệ, tin tức bị trì hoãn hoặc cảm giác bế tắc không lối thoát. Khi úp ngược, sắc thái xoay quanh những điều như trì trệ, chậm trễ, bế tắc. Gợi ý thiết thực: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"upE":"một sự tận tâm rèn giũa kỹ năng, chăm chỉ trau dồi để đạt đến thành thạo",
"revE":"một sự chán nản với công việc lặp lại, thiếu chú tâm khiến chất lượng giảm sút",
"upA":"Tiếp tục trau dồi kỹ năng, sự thành thạo cần thời gian để đạt được.",
"revA":"Tìm lại động lực hoặc thay đổi cách tiếp cận công việc.","arcana":"minor","element":"Đất","suitVi":"Tiền","number":8},
"Nine of Pentacles":{
"up":"Về vật chất, tài chính và công việc, kiên cường, gần đạt được mục tiêu dù đã mệt mỏi và cần thận trọng. Ở khía cạnh tình yêu, sự ổn định, cam kết lâu dài và nền tảng vật chất cho tình cảm. Về phương diện sự nghiệp, tài chính, đầu tư dài hạn, xây dựng sự nghiệp bền vững. Điều nên làm lúc này: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"rev":"Về vật chất, tài chính và công việc, kiệt sức, hoang mang hoặc mất niềm tin ngay trước ngưỡng thành công. Năng lượng ngược lúc này gắn liền với các sắc thái như kiệt sức, hoang mang, mất niềm tin. Bài học rút ra từ lá bài này: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"upE":"một sự độc lập và sung túc tự thân, tận hưởng thành quả từ chính nỗ lực bản thân",
"revE":"một sự phụ thuộc tài chính, mất kết nối với thành quả mình đã tạo ra",
"upA":"Tận hưởng sự độc lập và thành quả bạn đã tự mình tạo ra.",
"revA":"Tìm lại sự độc lập về tài chính và cảm xúc cho bản thân.","arcana":"minor","element":"Đất","suitVi":"Tiền","number":9},
"Ten of Pentacles":{
"up":"Về vật chất, tài chính và công việc, hoàn thành một chu kỳ, dù có thể đi kèm gánh nặng hoặc trách nhiệm lớn. Về đường tình duyên, sự ổn định, cam kết lâu dài và nền tảng vật chất cho tình cảm. Đối với công việc hiện tại, tài chính, đầu tư dài hạn, xây dựng sự nghiệp bền vững. Gợi ý thiết thực: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"rev":"Về vật chất, tài chính và công việc, giải phóng bớt gánh nặng, hoặc cảm giác quá tải kéo dài chưa được giải quyết. Ở chiều đảo ngược, những từ khóa nổi bật là giải tỏa gánh nặng, quá tải, kiệt sức kéo dài. Lời khuyên dành cho bạn: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"upE":"một sự thịnh vượng bền vững qua nhiều thế hệ, một di sản lâu dài được xây dựng",
"revE":"một sự bất ổn tài chính trong gia đình, mâu thuẫn về thừa kế hoặc giá trị truyền thống",
"upA":"Xây dựng nền tảng lâu dài cho những thế hệ tiếp theo.",
"revA":"Giải quyết mâu thuẫn tài chính trong gia đình một cách rõ ràng.","arcana":"minor","element":"Đất","suitVi":"Tiền","number":10},
"Page of Pentacles":{
"up":"Về vật chất, tài chính và công việc, một tin tức mới, sự tò mò và tinh thần học hỏi non trẻ trong lĩnh vực của chất bài này. Soi vào các mối quan hệ đang có, sự ổn định, cam kết lâu dài và nền tảng vật chất cho tình cảm. Trong chuyện làm ăn, công việc, tài chính, đầu tư dài hạn, xây dựng sự nghiệp bền vững. Bài học rút ra từ lá bài này: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"rev":"Về vật chất, tài chính và công việc, tin tức chưa chắc chắn, sự thiếu chín chắn hoặc do dự trước điều mới mẻ. Mặt khuất của lá bài thể hiện qua cảm giác thiếu chín chắn, do dự, tin đồn. Điều nên làm lúc này: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"upE":"một sự ham học hỏi thực tế, tinh thần cầu tiến với kế hoạch cụ thể cho tương lai",
"revE":"một sự thiếu tập trung vào kế hoạch dài hạn, mơ mộng nhưng chưa hành động",
"upA":"Lập kế hoạch cụ thể và bắt đầu từng bước nhỏ thực tế.",
"revA":"Biến ước mơ thành những bước hành động cụ thể hơn.","arcana":"minor","element":"Đất","suitVi":"Tiền","number":null},
"Knight of Pentacles":{
"up":"Về vật chất, tài chính và công việc, hành động quyết liệt, theo đuổi mục tiêu với nhiệt huyết đặc trưng của chất bài này. Trong tình yêu lúc này, sự ổn định, cam kết lâu dài và nền tảng vật chất cho tình cảm. Về công việc và sự nghiệp, tài chính, đầu tư dài hạn, xây dựng sự nghiệp bền vững. Lời khuyên dành cho bạn: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"rev":"Về vật chất, tài chính và công việc, hành động bốc đồng, thiếu kiên nhẫn hoặc theo đuổi một cách cực đoan. Khi úp ngược, sắc thái xoay quanh những điều như bốc đồng, cực đoan, thiếu kiên nhẫn. Gợi ý thiết thực: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"upE":"một sự cần cù đáng tin cậy, từng bước chắc chắn tiến tới mục tiêu bằng kiên trì",
"revE":"một sự trì trệ do quá thận trọng, ngại thay đổi khiến cơ hội trôi qua",
"upA":"Kiên trì từng bước, sự chắc chắn sẽ mang lại thành quả bền vững.",
"revA":"Dám thử điều mới thay vì mãi bám vào sự an toàn quen thuộc.","arcana":"minor","element":"Đất","suitVi":"Tiền","number":null},
"Queen of Pentacles":{
"up":"Về vật chất, tài chính và công việc, sự trưởng thành, thấu hiểu sâu sắc và khả năng nuôi dưỡng năng lượng của chất bài này từ bên trong. Với những ai đang để tâm đến chuyện tình cảm, sự ổn định, cam kết lâu dài và nền tảng vật chất cho tình cảm. Trên con đường sự nghiệp, tài chính, đầu tư dài hạn, xây dựng sự nghiệp bền vững. Điều nên làm lúc này: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"rev":"Về vật chất, tài chính và công việc, mất kết nối với bản chất của chính mình, hoặc bộc lộ theo hướng thái quá, thiếu lành mạnh. Năng lượng ngược lúc này gắn liền với các sắc thái như mất kết nối bản thân, thái quá, bất an nội tâm. Bài học rút ra từ lá bài này: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",
"upE":"một sự ấm áp thực tế, chăm sóc chu đáo cả về vật chất lẫn tinh thần",
"revE":"một sự mất cân bằng, quên chăm sóc chính mình khi mải lo cho người khác",
"upA":"Chăm sóc người khác nhưng đừng quên chăm sóc cả bản thân mình.",
"revA":"Dành thời gian chăm sóc lại chính mình trước khi tiếp tục cho đi.","arcana":"minor","element":"Đất","suitVi":"Tiền","number":null},
"King of Pentacles":{
"up":"Về vật chất, tài chính và công việc, sự làm chủ, quyền lực vững vàng và khả năng dẫn dắt bằng kinh nghiệm trong lĩnh vực này. Trong chuyện tình cảm, lá bài gợi ý rằng sự ổn định, cam kết lâu dài và nền tảng vật chất cho tình cảm. Nhìn sang khía cạnh công việc, tài chính, đầu tư dài hạn, xây dựng sự nghiệp bền vững. Gợi ý thiết thực: Kiên nhẫn xây dựng nền tảng vững chắc thay vì chạy theo kết quả nhanh.",

        let currentDeck = [];

        function setAssetProgress(progress, label) {
            const pct = Math.max(0, Math.min(100, Math.round(progress)));
            const text = document.getElementById('asset-progress-text');
            const bar = document.getElementById('asset-progress-bar');
            if (text) text.innerText = label ? `${label} ${pct}%` : `${pct}%`;
            if (bar) bar.style.width = `${pct}%`;
        }

        function updateIdleStatus() {
            if (currentState !== STATE.IDLE) return;
            if (cameraError) return;
            const status = document.getElementById('status-text');
            if (!status) return;
            if (assetsFailed) {
                status.innerText = "Tải tài nguyên thất bại, nhấn để thử lại";
                return;
            }
            if (!assetsReady) {
                status.innerText = "Đang tải tài nguyên...";
                return;
            }
            if (cameraReady) {
                status.innerText = "Giơ tay ra trước camera để bắt đầu bốc bài";
            }
        }

        function preloadDeckAssets() {
            const loader = document.getElementById('asset-loader');
            const retryBtn = document.getElementById('asset-retry-btn');
            if (retryBtn) retryBtn.style.display = 'none';
            if (loader) loader.style.display = 'flex';

            assetsReady = false;
            assetsFailed = false;
            setAssetProgress(0);
            updateIdleStatus();

            const images = FULL_DECK.map(c => c.img).filter(Boolean);
            const uniqueImages = Array.from(new Set(images));
            const total = uniqueImages.length;
            let doneCount = 0;
            let failCount = 0;

            if (total === 0) {
                assetsReady = true;
                if (loader) loader.style.display = 'none';
                updateIdleStatus();
                return;
            }

            uniqueImages.forEach((src) => {
                const img = new Image();
                img.decoding = 'async';
                img.onload = () => {
                    doneCount += 1;
                    const progress = ((doneCount + failCount) / total) * 100;
                    setAssetProgress(progress);
                    if (doneCount + failCount === total) finish();
                };
                img.onerror = () => {
                    failCount += 1;
                    const progress = ((doneCount + failCount) / total) * 100;
                    setAssetProgress(progress);
                    if (doneCount + failCount === total) finish();
                };
                img.src = src;
            });

            function finish() {
                if (failCount > 0) {
                    assetsFailed = true;
                    setAssetProgress(100, "Tải thất bại");
                    if (retryBtn) retryBtn.style.display = 'inline-block';
                    if (retryBtn) retryBtn.onclick = () => preloadDeckAssets();
                    updateIdleStatus();
                    return;
                }
                assetsReady = true;
                setAssetProgress(100, "Tải xong");
                if (loader) loader.style.display = 'none';
                updateIdleStatus();
            }
        }
        
        // --- 2. Game State & Logic ---
        const STATE = {
            IDLE: 'IDLE',

        };

        // --- 3. 3D Scene & Rendering ---
        const scene = document.getElementById('scene');
        
        function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            
            let width, height, stars = [];
            
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                stars = [];
                for(let i=0; i<200; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        size: Math.random() * 2,
                        opacity: Math.random(),
                        speed: Math.random() * 0.5
                    });
                }
            }
            
            function animate() {
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = 'white';
                
                stars.forEach(star => {
                    ctx.globalAlpha = star.opacity;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    star.y -= star.speed;
                    if(star.y < 0) star.y = height;
                    
                    // Twinkle
                    if(Math.random() > 0.95) star.opacity = Math.random();
                });
                
                requestAnimationFrame(animate);
            }
            
            window.addEventListener('resize', resize);
            resize();
            animate();
        }

        // Shuffle Array
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createCardElement(card, index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.dataset.index = index;
            
            const inner = document.createElement('div');
            inner.className = 'card-inner';
            
            const back = document.createElement('div');
            back.className = 'card-face card-back';
            
            const front = document.createElement('div');
            front.className = 'card-face card-front';
            front.style.backgroundImage = `url('${card.img}')`;
            
            inner.appendChild(back);
            inner.appendChild(front);
            wrapper.appendChild(inner);
            
            return wrapper;
        }

        function renderDeck() {
            scene.innerHTML = '';
            
            // Render logic based on state
            if (currentState === STATE.PICKING || currentState === STATE.INTRO) {
                // Render a fan or spread of cards
                // For simplicity and "coolness", we use a horizontal carousel
                
                currentDeck.forEach((card, i) => {
                    const el = createCardElement(card, i);
                    scene.appendChild(el);
                });
                updateCardPositions();
            } else if (currentState === STATE.REVEALING || currentState === STATE.INTERPRETING) {
                // Render only picked cards centered
                pickedCards.forEach((item, i) => {
                    const el = createCardElement(item.card, i);
                    // Add picked specific styles if needed
                    el.classList.add('picked-card');
                    // Immediately flip if revealed
                    // Logic handled in updatePickedPositions
                    scene.appendChild(el);
                });
                updatePickedPositions();
            }
        }

        function updateCardPositions() {
            if (currentState !== STATE.PICKING && currentState !== STATE.INTRO) return;

            const cards = document.querySelectorAll('.card-wrapper');
            const width = window.innerWidth;
            
            // Responsive Layout Calculation
            // Base gap + factor of screen width
            // This ensures on wide screens cards are spread out more
            const cardWidthVar = getComputedStyle(document.documentElement).getPropertyValue('--card-width').trim();
            const cardWidthPx = parseFloat(cardWidthVar) || 200;
            const compactMedia = window.matchMedia && window.matchMedia('(orientation: landscape) and (max-height: 520px)').matches;
            const isMobile = width <= 480 || compactMedia;
            const gap = Math.min(
                Math.max(cardWidthPx * (isMobile ? 0.85 : 1.15), width * (isMobile ? 0.12 : 0.18)),
                cardWidthPx * (isMobile ? 1.25 : 2)
            );
            
            // Calculate how many cards to show based on screen width
            // Due to Z-depth, cards shrink, so we need more margin
            // If gap is 300, and width is 1920 (half 960), we need ~3.2 cards.
            // But Z-depth makes them squeeze. Let's be generous.
            const visibleSideCount = Math.ceil((width / 2) / (gap * 0.5)) + 3;
            
            cards.forEach((card, i) => {
                // Check if card is already picked
                if (card.classList.contains('picked')) {
                    return; // Skip positioning logic for picked cards
                }

                const dist = i - currentIndex;
                
                if (Math.abs(dist) > visibleSideCount) {
                    card.style.display = 'none';
                    return;
                } else {
                    card.style.display = 'block';
                }

                const x = dist * gap;
                // Reduce Z-depth dropoff to keep peripheral cards larger/closer
                const z = -Math.pow(Math.abs(dist), 1.3) * 50; 
                
                // Reduced rotation to keep back visible (prevent face peeking)
                // Clamp rotation to max 45 degrees
                let rotateY = dist * 5; 
                if (rotateY > 45) rotateY = 45;
                if (rotateY < -45) rotateY = -45;
                
                let scale = 1;
                const isSelected = Math.round(currentIndex) === i;
                
                if (Math.abs(dist) < 0.5) {
                    const selectedScaleBase = isMobile ? 1.06 : 1.2;
                    const selectedScaleFalloff = isMobile ? 0.22 : 0.4;
                    scale = selectedScaleBase - Math.abs(dist) * selectedScaleFalloff;
                    card.style.zIndex = 1000;
                } else {
                    // Less aggressive scaling down for side cards
                    scale = 1 - Math.min(Math.abs(dist) * 0.08, 0.4);
                    card.style.zIndex = 1000 - Math.floor(Math.abs(dist) * 10);
                }
                
                if (isSelected) {
                     card.classList.add('selected');
                } else {
                     card.classList.remove('selected');
                }

                if (isFistHeld && chargeTargetIndex !== null && i === chargeTargetIndex) {
                    scale *= chargeExtraScale;
                    card.style.zIndex = 2000;
                }
                
                card.style.transform = `translateX(${x}px) translateZ(${z}px) rotateY(${rotateY}deg) scale(${scale})`;
            });
        }

        function updatePickedPositions() {
            const cards = document.querySelectorAll('.card-wrapper');
            
            // Responsive spacing for picked cards
            const width = window.innerWidth;
            const compactMedia = window.matchMedia && window.matchMedia('(orientation: landscape) and (max-height: 520px)').matches;
            const spread = (width <= 480 || compactMedia) ? Math.min(width * 0.18, 180) : Math.min(width * 0.3, 400);
            
            const positions = [-spread, 0, spread];
            
            cards.forEach((card, i) => {
                const x = positions[i];
                // If this card is revealed, flip it
                if (i < pickedCards.length) {
                    const picked = pickedCards[i];
                    // Reveal animation
                    setTimeout(() => {
                        card.classList.add('flipped');
                        // Add reversed visual if needed
                        if (picked.reversed) {
                            // Find the front face and rotate it
                            const front = card.querySelector('.card-front');
                            if (front) {
                                front.style.transform = 'rotateX(180deg)'; // Flip upside down
                            }
                        }
                    }, i * 500 + 500); // Staggered reveal
                }
                
                card.style.transform = `translateX(${x}px) scale(1.1)`;
                card.style.zIndex = 10;
            });
        }

        // --- 4. Controls & Hand Gestures ---

        let fistHoldStart = 0;

        function isFist(landmarks) {
            // Check fingertips (8, 12, 16, 20) distance to wrist (0)
            const wrist = landmarks[0];
            const tips = [8, 12, 16, 20];
            let avgDist = 0;
            
            tips.forEach(idx => {
                const tip = landmarks[idx];
                const d = Math.sqrt(Math.pow(tip.x - wrist.x, 2) + Math.pow(tip.y - wrist.y, 2));
                avgDist += d;
            });
            avgDist /= tips.length;
            
            // Threshold for fist (tuned for normalized coordinates)
            return avgDist < 0.23; 
        }

        function isOpenPalm(landmarks) {
             // Check fingertips (8, 12, 16, 20) distance to wrist (0)
            const wrist = landmarks[0];
            const tips = [8, 12, 16, 20];
            let avgDist = 0;
            
            tips.forEach(idx => {
                const tip = landmarks[idx];
                const d = Math.sqrt(Math.pow(tip.x - wrist.x, 2) + Math.pow(tip.y - wrist.y, 2));
                avgDist += d;
            });
            avgDist /= tips.length;
            
            // Threshold for open palm (fingers extended)
            return avgDist > 0.4; 
        }

                p.style.left = (x + ox) + 'px';

                // Varied properties
